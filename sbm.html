                    return 'Primary contact is already the main recipient, so CC is disabled.';
                }
                if (!cnt || !cnt.email_id) {
                    return 'This contact has no email address.';
                }
                return this.isContactInCc(cnt) ? 'Remove this email from Default CC Matrix' : 'Add this email to Default CC Matrix';
            },
            setPrimarySbmAddress(addr) {
                if (!addr || !addr.name || !this.sbmSupplierDetails || !this.sbmSupplierDetails.name) return;
                if (this.isPrimaryAddress(addr)) {
                    frappe.msgprint({
                        title: 'Already primary',
                        indicator: 'blue',
                        message: `“${addr.address_title || addr.name}” is already the Primary Address.`
                    });
                    return;
                }
                const supplierLabel = this.sbmSupplierDetails.supplier_name || this.sbmSupplierDetails.name;
                frappe.confirm(
                    `Set “${addr.address_title || addr.name}” as the Primary Address for “${supplierLabel}”? This will be saved immediately.`,
                    () => {
                        this.sbmSupplierDetails.supplier_primary_address = addr.name;
                        this.saveSbmGeneralDetails();
                    }
                );
            },
            setPrimarySbmContact(cnt) {
                if (!cnt || !cnt.name || !this.sbmSupplierDetails || !this.sbmSupplierDetails.name) return;
                if (this.isPrimaryContact(cnt)) {
                    frappe.msgprint({
                        title: 'Already primary',
                        indicator: 'blue',
                        message: `“${((cnt.first_name || '') + ' ' + (cnt.last_name || '')).trim() || cnt.name}” is already the Primary Contact.`
                    });
                    return;
                }
                const contactLabel = `${cnt.first_name || ''} ${cnt.last_name || ''}`.trim() || cnt.name;
                const supplierLabel = this.sbmSupplierDetails.supplier_name || this.sbmSupplierDetails.name;
                frappe.confirm(
                    `Set “${contactLabel}” as the Primary Contact for “${supplierLabel}”? This will be saved immediately.`,
                    () => {
                        this.sbmSupplierDetails.supplier_primary_contact = cnt.name;
                        this.saveSbmGeneralDetails();
                    }
                );
            },
            toggleContactCc(cnt) {
                if (!cnt || !this.sbmSupplierDetails) return;
                if (this.isPrimaryContact(cnt)) return;
                const email = (cnt.email_id || '').trim();
                if (!email) {
                    frappe.msgprint({
                        title: 'No email',
                        indicator: 'orange',
                        message: 'This contact has no email address to add to CC.'
                    });
                    return;
                }
                const current = this.parsedDefaultCc.slice();
                const idx = current.findIndex((e) => e.toLowerCase() === email.toLowerCase());
                if (idx >= 0) {
                    current.splice(idx, 1);
                } else {
                    current.push(email);
                }
                this.sbmSupplierDetails.custom_default_cc = current.join(', ');
                this.saveSbmGeneralDetails();
            },
            deleteSbmAddress(addr) {
                if (!this.canDeleteSbmAddress) {
                    frappe.msgprint({
                        title: 'Not allowed',
                        indicator: 'red',
                        message: 'Only Procurement T3 can delete supplier addresses.'
                    });
                    return;
                }
                if (!this.sbmActiveSupplier || !addr || !addr.name) return;
                const label = addr.address_title || addr.name;
                frappe.confirm(
                    `Delete address “${label}” from supplier ${this.sbmActiveSupplier}? This removes the Address record.`,
                    () => {
                        frappe.call({
                            method: 'my_custom_app.sbm.delete_sbm_address',
                            args: {
                                supplier_name: this.sbmActiveSupplier,
                                address_name: addr.name
                            },
                            callback: (r) => {
                                if (r.message && r.message.status === 'success') {
                                    frappe.show_alert({ message: 'Address deleted.', indicator: 'green' });
                                    this.selectSbmSupplier(this.sbmActiveSupplier);
                                } else {
                                    frappe.msgprint({
                                        title: 'Delete Failed',
                                        indicator: 'red',
                                        message: (r.message && r.message.error) || 'Could not delete address. It may be linked to other records.'
                                    });
                                }
                            }
                        });
                    }
                );
            },
            toggleSbmSupplierLinkExpanded(supLink) {
                if (!supLink) return;
                supLink._expanded = !supLink._expanded;
            },
            loadSbmSupplierActivity(supplierName) {
                if (!supplierName) {
                    this.sbmSupplierActivity = [];
                    return;
                }
                this.sbmActivityLoading = true;
                this.sbmSupplierActivity = [];
                frappe.call({
                    method: 'my_custom_app.sbm.get_sbm_supplier_activity',
                    args: { supplier_name: supplierName },
                    callback: (r) => {
                        this.sbmActivityLoading = false;
                        if (r.message && r.message.status === 'success') {
                            this.sbmSupplierActivity = r.message.data || [];
                        } else {
                            this.sbmSupplierActivity = [];
                        }
                    },
                    error: () => {
                        this.sbmActivityLoading = false;
                        this.sbmSupplierActivity = [];
                    }
                });
            },
			
			isInteractiveDragIgnore(evt) {
                const el = evt && evt.target ? evt.target.closest('button, a, input, select, textarea, .btn, .form-control, .form-select') : null;
                return !!el;
            },

            onContactDragStart(evt, cnt) {
                if (this.isInteractiveDragIgnore(evt)) {
                    evt.preventDefault();
                    return;
                }
                if (!cnt || !cnt.name) {
                    evt.preventDefault();
                    return;
                }
                this.sbmDraggingContact = {
                    name: cnt.name,
                    first_name: cnt.first_name || '',
                    last_name: cnt.last_name || '',
                    email_id: cnt.email_id || ''
                };
                this.sbmContactDropReady = false;
                this.sbmContactDropDepth = 0;
                if (evt.dataTransfer) {
                    evt.dataTransfer.effectAllowed = 'copy';
                    evt.dataTransfer.setData('text/plain', cnt.name);
                }
            },

            onContactDragEnd() {
                this.sbmDraggingContact = null;
                this.sbmContactDropReady = false;
                this.sbmContactDropDepth = 0;
            },

            onPrimaryContactDragOver(evt) {
                if (!this.sbmDraggingContact) return;
                if (evt.dataTransfer) evt.dataTransfer.dropEffect = 'copy';
            },

            onPrimaryContactDragEnter(evt) {
                if (!this.sbmDraggingContact) return;
                this.sbmContactDropDepth += 1;
                this.sbmContactDropReady = true;
            },

            onPrimaryContactDragLeave(evt) {
                if (!this.sbmDraggingContact) return;
                this.sbmContactDropDepth -= 1;
                if (this.sbmContactDropDepth <= 0) {
                    this.sbmContactDropDepth = 0;
                    this.sbmContactDropReady = false;
                }
            },

            onPrimaryContactDrop(evt) {
                const dragged = this.sbmDraggingContact;
                this.sbmContactDropReady = false;
                this.sbmContactDropDepth = 0;
                this.sbmDraggingContact = null;
                if (!dragged || !dragged.name) return;
                this.confirmSetPrimaryContactFromDrag(dragged);
            },

            confirmSetPrimaryContactFromDrag(cnt) {
                if (!this.sbmSupplierDetails || !this.sbmSupplierDetails.name) return;

                const contactLabel = `${cnt.first_name || ''} ${cnt.last_name || ''}`.trim() || cnt.name;
                const supplierLabel = this.sbmSupplierDetails.supplier_name || this.sbmSupplierDetails.name;

                if (this.sbmSupplierDetails.supplier_primary_contact === cnt.name) {
                    frappe.msgprint({
                        title: 'Already primary',
                        indicator: 'blue',
                        message: `“${contactLabel}” is already the Primary Contact for ${supplierLabel}.`
                    });
                    return;
                }

                frappe.confirm(
                    `You are about to set “${contactLabel}” as the Primary Contact for supplier “${supplierLabel}”. This will be saved immediately. Please confirm if this is OK.`,
                    () => {
                        this.sbmSupplierDetails.supplier_primary_contact = cnt.name;
                        this.saveSbmGeneralDetails();
                    }
                );
            },

            getDivisionDropKey(divRow) {
                if (!divRow) return '';
                if (divRow.is_virtual) return '__virtual__';
                return divRow.name || '';
            },

            isDivisionDropReady(divRow) {
                return !!this.sbmDraggingSupplierLink && this.sbmDivisionDropKey === this.getDivisionDropKey(divRow);
            },

            onSupplierLinkDragStart(evt, sourceDivRow, supLink) {
                if (this.isInteractiveDragIgnore(evt)) {
                    evt.preventDefault();
                    return;
                }
                if (!supLink || !supLink.supplier) {
                    evt.preventDefault();
                    return;
                }
                this.sbmDraggingSupplierLink = {
                    name: supLink.name || '',
                    supplier: supLink.supplier,
                    supplier_name: supLink.supplier_name || supLink.supplier,
                    type: supLink.type || 'OTHER',
                    notes: supLink.notes || ''
                };
                this.sbmDraggingFromDivisionKey = this.getDivisionDropKey(sourceDivRow);
                this.sbmDivisionDropKey = null;
                this.sbmDivisionDropDepth = 0;
                if (evt.dataTransfer) {
                    evt.dataTransfer.effectAllowed = 'copy';
                    evt.dataTransfer.setData('text/plain', supLink.supplier);
                }
            },

            onSupplierLinkDragEnd() {
                this.sbmDraggingSupplierLink = null;
                this.sbmDraggingFromDivisionKey = null;
                this.sbmDivisionDropKey = null;
                this.sbmDivisionDropDepth = 0;
            },

            onDivisionDragOver(evt, divRow) {
                if (!this.sbmDraggingSupplierLink) return;
                if (evt.dataTransfer) evt.dataTransfer.dropEffect = 'copy';
            },

            onDivisionDragEnter(evt, divRow) {
                if (!this.sbmDraggingSupplierLink) return;
                const key = this.getDivisionDropKey(divRow);
                if (this.sbmDivisionDropKey === key) {
                    this.sbmDivisionDropDepth += 1;
                } else {
                    this.sbmDivisionDropKey = key;
                    this.sbmDivisionDropDepth = 1;
                }
            },

            onDivisionDragLeave(evt, divRow) {
                if (!this.sbmDraggingSupplierLink) return;
                const key = this.getDivisionDropKey(divRow);
                if (this.sbmDivisionDropKey !== key) return;
                this.sbmDivisionDropDepth -= 1;
                if (this.sbmDivisionDropDepth <= 0) {
                    this.sbmDivisionDropDepth = 0;
                    this.sbmDivisionDropKey = null;
                }
            },

            onDivisionDrop(evt, targetDivRow) {
                const dragged = this.sbmDraggingSupplierLink;
                const fromKey = this.sbmDraggingFromDivisionKey;
                this.sbmDraggingSupplierLink = null;
                this.sbmDraggingFromDivisionKey = null;
                this.sbmDivisionDropKey = null;
                this.sbmDivisionDropDepth = 0;
                if (!dragged || !dragged.supplier || !targetDivRow) return;
                this.confirmCopySupplierLinkToDivision(fromKey, targetDivRow, dragged);
            },

            confirmCopySupplierLinkToDivision(fromKey, targetDivRow, dragged) {
                const targetKey = this.getDivisionDropKey(targetDivRow);
                const sourceLabel = this.getDivisionLabelByKey(fromKey);
                const targetLabel = targetDivRow.div_name || targetDivRow.name || 'General / No Division';
                const supplierLabel = dragged.supplier_name || dragged.supplier;
                const brandLabel = this.sbmActiveBrand || '';

                if (fromKey === targetKey) {
                    frappe.msgprint({
                        title: 'Same division',
                        indicator: 'blue',
                        message: `“${supplierLabel}” is already on division “${targetLabel}”. Drop it onto a different division to copy the link.`
                    });
                    return;
                }

                const already = (targetDivRow.suppliers || []).some((s) => s && s.supplier === dragged.supplier);
                if (already) {
                    frappe.msgprint({
                        title: 'Already linked',
                        indicator: 'orange',
                        message: `Supplier “${supplierLabel}” is already linked to division “${targetLabel}” on brand “${brandLabel}”.`
                    });
                    return;
                }

                frappe.confirm(
                    `You are about to copy supplier “${supplierLabel}” from division “${sourceLabel}” to division “${targetLabel}” on brand “${brandLabel}”. This creates a new Supplier Brand Relationship. The original link on “${sourceLabel}” will stay in place. Please confirm if this is OK.`,
                    () => {
                        this.copySupplierLinkToDivision(targetDivRow, dragged);
                    }
                );
            },

            getDivisionLabelByKey(key) {
                const divisions = (this.sbmBrandDetails && this.sbmBrandDetails.divisions) ? this.sbmBrandDetails.divisions : [];
                const match = divisions.find((d) => this.getDivisionDropKey(d) === key);
                if (!match) return 'the original division';
                return match.div_name || match.name || 'General / No Division';
            },

            copySupplierLinkToDivision(targetDivRow, dragged) {
                if (!this.sbmActiveBrand) return;
                if (!dragged || !dragged.supplier) return;

                const payload = {
                    is_new: true,
                    name: '',
                    supplier: dragged.supplier,
                    brand: this.sbmActiveBrand,
                    division: targetDivRow.is_virtual ? '' : (targetDivRow.name || ''),
                    type: dragged.type || 'OTHER',
                    notes: dragged.notes || ''
                };

                frappe.call({
                    method: 'my_custom_app.procurement_panel.save_sbm_relationship',
                    args: { payload: JSON.stringify(payload) },
                    callback: (r) => {
                        if (r.message && r.message.status === 'success') {
                            frappe.show_alert({
                                message: `Copied ${dragged.supplier_name || dragged.supplier} onto ${targetDivRow.div_name || targetDivRow.name || 'General / No Division'}.`,
                                indicator: 'green'
                            });
                            if (!targetDivRow._expanded) {
                                targetDivRow._expanded = true;
                            }
                            this.selectSbmBrand(this.sbmActiveBrand);
                            this.loadSbmBrandList();
                        } else {
                            frappe.msgprint({
                                title: 'Copy Failed',
                                indicator: 'red',
                                message: (r.message && r.message.error) || 'Could not create the relationship.'
                            });
                        }
                    }
                });
            },
			
			
            openNewSbmAddressModal() {
                this.sbmAddressForm = { name: '', address_title: '', address_type: 'Billing', address_line1: '', city: '', country: '', pincode: '' };
                this.showSbmAddressModal = true;
            },
            openEditSbmAddressModal(addr) {
                this.sbmAddressForm = { 
                    name: addr.name, 
                    address_title: addr.address_title || '', 
                    address_type: addr.address_type || 'Billing', 
                    address_line1: addr.address_line1 || '', 
                    city: addr.city || '', 
                    country: addr.country || '', 
                    pincode: addr.pincode || '' 
                };
                this.showSbmAddressModal = true;
            },
            saveSbmAddress() {
                if (!this.sbmAddressForm.address_title || !this.sbmAddressForm.address_type || !this.sbmAddressForm.address_line1 || !this.sbmAddressForm.country) {
                    frappe.msgprint("Please fill out all mandatory (*) address fields.");
                    return;
                }

                let targetMethod = this.sbmAddressForm.name ? 'my_custom_app.procurement_panel.update_sbm_address' : 'my_custom_app.procurement_panel.create_sbm_address';
                let args = this.sbmAddressForm.name ? { payload: JSON.stringify(this.sbmAddressForm) } : { supplier_name: this.sbmActiveSupplier, payload: JSON.stringify(this.sbmAddressForm) };
                frappe.call({
                    method: targetMethod,
                    args: args,
                    callback: (r) => {
                        if (r.message && r.message.status === 'success') {
                            let msg = this.sbmAddressForm.name ? "Address updated successfully!" : "Address created and linked!";
                            frappe.show_alert({message: msg, indicator: 'green'});
                            this.showSbmAddressModal = false;
                            this.selectSbmSupplier(this.sbmActiveSupplier); // Refresh data
                        } else {
                            frappe.msgprint({title: 'Error', indicator: 'red', message: r.message?.error || "Failed to process address"});
                        }
                    }
                });
            },
            openNewSbmContactModal() {
                this.sbmContactForm = { name: '', first_name: '', last_name: '', email_id: '', existing_contact_name: '' };
                this.sbmContactMatches = [];
                this.showSbmContactMatchDrop = false;
                this.showSbmContactModal = true;
            },
            openEditSbmContactModal(cnt) {
                this.sbmContactForm = {
                    name: cnt.name,
                    first_name: cnt.first_name || '',
                    last_name: cnt.last_name || '',
                    email_id: cnt.email_id || '',
                    existing_contact_name: ''
                };
                this.sbmContactMatches = [];
                this.showSbmContactMatchDrop = false;
                this.showSbmContactModal = true;
            },
            onSbmContactEmailFocus() {
                if (this.sbmContactForm.name) return;
                if ((this.sbmContactForm.email_id || '').trim().length >= 2) {
                    this.showSbmContactMatchDrop = true;
                    this.searchSbmContactsForModal();
                }
            },
            onSbmContactEmailInput() {
                if (this.sbmContactForm.name) return;
                this.sbmContactForm.existing_contact_name = '';
                const q = (this.sbmContactForm.email_id || '').trim();
                if (q.length < 2) {
                    this.sbmContactMatches = [];
                    this.showSbmContactMatchDrop = false;
                    return;
                }
                this.showSbmContactMatchDrop = true;
                if (this.sbmContactSearchTimer) {
                    clearTimeout(this.sbmContactSearchTimer);
                }
                this.sbmContactSearchTimer = setTimeout(() => {
                    this.searchSbmContactsForModal();
                }, 250);
            },
			
			
            searchSbmContactsForModal() {
                const q = (this.sbmContactForm.email_id || '').trim();
                if (q.length < 2) {
                    this.sbmContactMatches = [];
                    return;
                }
                frappe.call({
                    method: 'my_custom_app.sbm.search_sbm_contacts',
                    args: {
                        query: q,
                        supplier_name: this.sbmActiveSupplier || ''
                    },
                    callback: (r) => {
                        if (r.message && r.message.status === 'success') {
                            this.sbmContactMatches = r.message.data || [];
                        } else {
                            this.sbmContactMatches = [];
                        }
                    }
                });
            },
            pickExistingSbmContact(c) {
                if (!c || !c.name) return;
                if (c.already_linked) {
                    frappe.msgprint({
                        title: 'Already linked',
                        indicator: 'blue',
                        message: `“${((c.first_name || '') + ' ' + (c.last_name || '')).trim() || c.name}” is already linked to this supplier.`
                    });
                    return;
                }
                this.sbmContactForm.first_name = c.first_name || '';
                this.sbmContactForm.last_name = c.last_name || '';
                this.sbmContactForm.email_id = c.email_id || this.sbmContactForm.email_id;
                this.sbmContactForm.existing_contact_name = c.name;
                this.showSbmContactMatchDrop = false;
            },
            saveSbmContact() {
                if (!this.sbmContactForm.first_name) {
                    frappe.msgprint("First Name is mandatory.");
                    return;
                }

                if (!this.sbmContactForm.name && this.sbmContactForm.existing_contact_name) {
                    frappe.call({
                        method: 'my_custom_app.sbm.link_sbm_contact',
                        args: {
                            supplier_name: this.sbmActiveSupplier,
                            contact_name: this.sbmContactForm.existing_contact_name
                        },
                        callback: (r) => {
                            if (r.message && r.message.status === 'success') {
                                frappe.show_alert({message: "Existing contact linked!", indicator: 'green'});
                                this.showSbmContactModal = false;
                                this.selectSbmSupplier(this.sbmActiveSupplier);
                            } else {
                                frappe.msgprint({title: 'Error', indicator: 'red', message: r.message?.error || "Failed to link contact"});
                            }
                        }
                    });
                    return;
                }

                let targetMethod = this.sbmContactForm.name ? 'my_custom_app.procurement_panel.update_sbm_contact' : 'my_custom_app.procurement_panel.create_sbm_contact';
                let args = this.sbmContactForm.name ? { payload: JSON.stringify(this.sbmContactForm) } : { supplier_name: this.sbmActiveSupplier, payload: JSON.stringify(this.sbmContactForm) };
                frappe.call({
                    method: targetMethod,
                    args: args,
                    callback: (r) => {
                        if (r.message && r.message.status === 'success') {
                            let msg = this.sbmContactForm.name ? "Contact updated successfully!" : "Contact created and linked!";
                            frappe.show_alert({message: msg, indicator: 'green'});
                            this.showSbmContactModal = false;
                            this.selectSbmSupplier(this.sbmActiveSupplier);
                        } else {
                            frappe.msgprint({title: 'Error', indicator: 'red', message: r.message?.error || "Failed to process contact"});
                        }
                    }
                });
            }
        },
        created() {
            var self = this;
            self.isLoggedIn = false;

            function tryCheck(attempt) {
                attempt = attempt || 0;

                if (typeof frappe === 'undefined' || !frappe.session) {
                    if (attempt < 30) {
                        setTimeout(function() {
                            tryCheck(attempt + 1);
                        }, 100);
                    }
                    return;
                }

                var user = frappe.session.user || 'Guest';
                console.log('AUTH CHECK (attempt ' + attempt + ') → frappe.session.user =', user);

                if (user && user !== 'Guest') {
                    self.isLoggedIn = true;
                    self.$nextTick(function() {
                        setTimeout(function() {
                            if (typeof self.initializeAfterLogin === 'function') {
                                self.initializeAfterLogin();
                            }
                        }, 200);
                    });
                } else if (attempt < 12) {
                    setTimeout(function() {
                        tryCheck(attempt + 1);
                    }, 250);
                } else {
                    self.isLoggedIn = false;
                }
            }

            setTimeout(function() {
                tryCheck(0);
            }, 50);
        }
    }).mount('#app');
</script>
</body>
</html>
