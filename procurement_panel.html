							{ field: 'due_date', operator: 'equals', value: todayStr },
							{ field: 'procurement_status', operator: 'contains', value: 'W' },
							{ field: 'ref', operator: 'contains', value: 'B' }
						];
					} else if (segment === 'day_w_total') {
						filtersToAdd = [
							{ field: 'due_date', operator: 'equals', value: todayStr },
							{ field: 'procurement_status', operator: 'contains', value: 'W' }

					} else if (segment === 'day_due_soon') {

						filtersToAdd = [
							{ field: 'due_date', operator: 'equals', value: tomorrow },
							{ field: 'procurement_status', operator: 'contains', value: 'W' }
						];
					} else if (segment === 'future_empties' || segment === 'future_ws') {
						// Future = 2+ days
						filtersToAdd = [
							{ field: 'due_date', operator: 'gte', value: new Date(Date.now() + 172800000).toISOString().split('T')[0] }
						];
						if (segment === 'future_empties') {

					this.showDashboard = false;           // switch to table
					this.currentPage = 1;

				},

								},
								{

							]
						},
						options: {
							responsive: true,
							maintainAspectRatio: false,
							scales: {

								x: { title: { display: true, text: 'RFQ Date (relative to today)' } }

							}
						}
					});
				},
				
				
				toggleDashboardView() {
					this.showDashboard = !this.showDashboard;

					if (this.showDashboard) {
						this.fetchDashboardData();           // always refresh when returning to dashboard
					} else {
						// When going to table, ensure personal REP filter is present for non-admins
						if (this.currentUserRep && !this.isAdmin) {
							const hasRep = this.activeFilters.some(f => f.field === 'rp' && f.value === this.currentUserRep);
							if (!hasRep) {
								this.activeFilters.unshift({ field: 'rp', operator: 'equals', value: this.currentUserRep });
							}
						}
						if (this.records.length === 0) this.fetchData();
					}
				},
				
				// ========== END NEW METHOD ==========

				startAutoSync() {
					if (this.syncInterval) clearInterval(this.syncInterval);
					this.nextUpdateIn = 300;
					this.syncInterval = setInterval(() => {
						this.nextUpdateIn--;
						if (this.nextUpdateIn <= 0) {
							this.nextUpdateIn = 300;
							if (this.userMode !== 'procurement' && this.userMode !== 'sales') return;
							if (this.isFetchingBadges) return;
							this.fetchQuickFilterBadges();
						}
					}, 1000);
				},
				fetchQuickFilterBadges() {
					if (this.userMode !== 'procurement' && this.userMode !== 'sales') {
						this.isFetchingBadges = false;
						return;
					}
					this.isFetchingBadges = true;

					// reset all progress & times
					Object.keys(this.badgeProgress).forEach(k => this.badgeProgress[k] = 0);
					Object.keys(this.badgeTimes).forEach(k => this.badgeTimes[k] = null);
					this.badgeLoadingKey = 'all';

					// Start a gentle global animation on every button while the single request is in flight
					const anim = setInterval(() => {
						Object.keys(this.badgeProgress).forEach(k => {
							if (this.badgeProgress[k] < 90) this.badgeProgress[k] += 6;
						});
					}, 80);

					const t0 = performance.now();

					frappe.call({
						method: 'my_custom_app.procurement_panel.get_quick_filter_badges',
						args: {
							user_rep: this.getActiveProcCode(),
							user_st: this.getActiveSalesCode(),
							group: 'all',
							mode: this.userMode,
							customer: (this.userMode === 'sales' && this.headerCustomerToggle) ? this.headerSelectedCustomer : null,
							scope: (this.userMode === 'sales')
								? ((this.canToggleSalesScope && this.salesScopeMode === 'global') ? 'global' : 'personal')
								: ((this.canToggleProcScope && this.procScopeMode === 'global') ? 'global' : 'personal'),
							horizon: this.futureHorizonMode
						},
						callback: (r) => {
							clearInterval(anim);

							const elapsedSec = ((performance.now() - t0) / 1000).toFixed(2);
							// Always store the timing. Visibility is controlled by the
							// existing v-if="isAdmin && badgeTimes.xxx !== null" in the HTML.
							Object.keys(this.badgeTimes).forEach(k => this.badgeTimes[k] = elapsedSec);

							// finish every progress bar
							Object.keys(this.badgeProgress).forEach(k => this.badgeProgress[k] = 100);

							if (r.message && r.message.status === 'success' && r.message.data) {
								// write every key the backend returned
								Object.assign(this.quickFilterData, r.message.data);
								this.applyBadgeAlertState();
								const now = new Date();
								this.lastBadgeRefreshAt = now.toLocaleTimeString('en-US', {
									hour: 'numeric',
									minute: '2-digit',
									second: '2-digit',
									hour12: true
								});
							}

							// ========== TIMING REPORT (same style as upload, Administrator only) ==========
							this.panelDebug(() => {
								console.group("%c⏱ Quick-Filter Badge COUNTS Timing", "color:#0d6efd;font-weight:bold;font-size:14px");
								console.log(`%cMode: ${this.userMode}`, "font-weight:bold");
								console.log(`%cTOTAL (bulk query): ${elapsedSec} s`, elapsedSec > 1.5 ? "color:red;font-weight:bold" : "color:green");
								if (r.message && r.message.data && r.message.data._elapsed_ms != null) {
									console.log("Backend reported _elapsed_ms:", r.message.data._elapsed_ms, "ms");
								}
								console.log("Returned keys:", Object.keys(r.message && r.message.data ? r.message.data : {}));
								console.groupEnd();
							});
							// =========================================================

							// short pause so the user sees the full bars, then clear them
							setTimeout(() => {
								Object.keys(this.badgeProgress).forEach(k => this.badgeProgress[k] = 0);
								this.isFetchingBadges = false;
								this.badgeLoadingKey = null;
							}, 250);
						},
						error: () => {
							clearInterval(anim);
							Object.keys(this.badgeProgress).forEach(k => this.badgeProgress[k] = 0);
							this.isFetchingBadges = false;
							this.badgeLoadingKey = null;
						}
					});
				},
				
				
				applyBadgeAlertState() {
					const pairs = [
						['today_xs', 'qf_alert_today_xs'],
						['future_xs', 'qf_alert_future_xs'],
						['today_total', 'qf_alert_today_total'],
						['future_total', 'qf_alert_future_total']
					];
					pairs.forEach(([key, field]) => {
						const count = parseInt(this.quickFilterData[field] || 0, 10) || 0;
						if (count <= 0) {
							this.badgeAlertAck[key] = 0;
							this.badgeAlert[key] = false;
							return;
						}
						this.badgeAlert[key] = count > (this.badgeAlertAck[key] || 0);
					});
				},

				acknowledgeBadgeAlert(group, type) {
					if (this.userMode !== 'procurement') return;
					if (this.procScopeMode !== 'global') return;
					if (this.selectedProcRepUser) return;
					if (type !== 'xs' && type !== 'total') return;
					const key = group + '_' + type;
					if (!Object.prototype.hasOwnProperty.call(this.badgeAlert, key)) return;
					const count = parseInt(this.quickFilterData['qf_alert_' + key] || 0, 10) || 0;
					this.badgeAlertAck[key] = count;
					this.badgeAlert[key] = false;
				},
				
				
				
				
				
				getActiveProcCode() {
					if (this.canToggleProcScope && this.procScopeMode === 'global') return '';
					if (this.canToggleProcScope && this.procScopeMode === 'rep' && this.selectedProcRepCode) {
						return String(this.selectedProcRepCode).trim();
					}
					return String(this.currentUserRep || '').trim();
				},
				
				getActiveSalesRefNeedle() {
					const code = String(this.getActiveSalesCode() || '').trim();
					if (!code) return '';
					return code.endsWith('-') ? code : (code + '-');
				},

				getActiveSalesCode() {
					if (this.canToggleSalesScope && this.salesScopeMode === 'global') return '';
					if (this.canToggleSalesScope && this.salesScopeMode === 'rep' && this.selectedSalesRepCode) {
						return String(this.selectedSalesRepCode).trim();
					}
					return String(this.currentUserST || '').trim();
				},

				shouldApplyProcRepFilter() {
					if (this.userMode !== 'procurement') return false;
					if (this.canToggleProcScope && this.procScopeMode === 'global') return false;
					return !!this.getActiveProcCode();
				},

				shouldApplySalesRefFilter() {
					if (this.userMode !== 'sales') return false;
					if (this.canToggleSalesScope && this.salesScopeMode === 'global') return false;
					return !!this.getActiveSalesCode();
				},

				isKnownProcScopeCode(value) {
					const v = String(value || '').trim();
					if (!v) return false;
					if (String(this.currentUserRep || '').trim() === v) return true;
					if (String(this.selectedProcRepCode || '').trim() === v) return true;
					return (this.procRepOptions || []).some(u => String(u.code || u.rep || '').trim() === v);
				},

				isKnownSalesScopeCode(value) {
					const v = String(value || '').trim().replace(/-+$/, '');
					if (!v) return false;
					if (String(this.currentUserST || '').trim() === v) return true;
					if (String(this.selectedSalesRepCode || '').trim() === v) return true;
					return (this.salesRepOptions || []).some(u => String(u.code || u.st || '').trim() === v);
				},

				syncActiveScopeFilterTag() {
					if (this.userMode === 'procurement') {
						const assignEmpty = this.activeFilters.some(f => f.field === 'rep' && f.operator === 'is_empty');
						const nextCode = this.getActiveProcCode();
						this.activeFilters = this.activeFilters.filter(f => {
							if (f.fromScope) return false;
							if (f.field === 'rep' && f.operator === 'equals' && this.isKnownProcScopeCode(f.value)) return false;
							return true;
						});
						if (this.shouldApplyProcRepFilter() && !assignEmpty && nextCode) {
							this.activeFilters.unshift({
								field: 'rep',
								operator: 'equals',
								value: nextCode,
								fromScope: true
							});
						}
					} else if (this.userMode === 'sales') {
						const nextCode = this.getActiveSalesCode();
						this.activeFilters = this.activeFilters.filter(f => {
							if (f.fromScope) return false;
							if (f.field === 'ref' && f.operator === 'contains' && this.isKnownSalesScopeCode(f.value)) return false;
							return true;
						});
						if (this.shouldApplySalesRefFilter() && nextCode) {
							this.activeFilters.unshift({
								field: 'ref',
								operator: 'contains',
								value: this.getActiveSalesRefNeedle(),
								fromScope: true
							});
						}
					}
					this.currentPage = 1;
					this.fetchData();
				},

				refreshScopeAndBadges() {
					this.fetchQuickFilterBadges();
					this.syncActiveScopeFilterTag();
				},

				toggleProcScopeMode() {
					if (!this.canToggleProcScope) return;
					if (this.procScopeMode === 'global') {
						this.procScopeMode = 'personal';
					} else {
						this.procScopeMode = 'global';
						this.selectedProcRepUser = '';
						this.selectedProcRepCode = '';
					}
					this.refreshScopeAndBadges();
				},

				toggleSalesScopeMode() {
					if (!this.canToggleSalesScope) return;
					if (this.salesScopeMode === 'global') {
						this.salesScopeMode = 'personal';
					} else {
						this.salesScopeMode = 'global';
						this.selectedSalesRepUser = '';
						this.selectedSalesRepCode = '';
					}
					this.refreshScopeAndBadges();
				},

				onProcRepSelected() {
					if (!this.canToggleProcScope) return;
					const name = (this.selectedProcRepUser || '').trim();
					if (!name) {
						this.selectedProcRepCode = '';
						this.procScopeMode = 'personal';
						this.refreshScopeAndBadges();
						return;
					}
					const match = (this.procRepOptions || []).find(u => u.name === name);
					const code = match ? String(match.code || match.rep || '').trim() : '';
					if (!code) {
						frappe.msgprint({
							title: 'Missing Rep Code',
							indicator: 'orange',
							message: 'The selected user has no User.rep value.'
						});
						this.selectedProcRepUser = '';
						this.selectedProcRepCode = '';
						return;
					}
					this.selectedProcRepCode = code;
					this.procScopeMode = 'rep';
					this.refreshScopeAndBadges();
				},

				onSalesRepSelected() {
					if (!this.canToggleSalesScope) return;
					const name = (this.selectedSalesRepUser || '').trim();
					if (!name) {
						this.selectedSalesRepCode = '';
						this.salesScopeMode = 'personal';
						this.refreshScopeAndBadges();
						return;
					}
					const match = (this.salesRepOptions || []).find(u => u.name === name);
					const code = match ? String(match.code || match.st || '').trim() : '';
					if (!code) {
						frappe.msgprint({
							title: 'Missing ST Code',
							indicator: 'orange',
							message: 'The selected user has no User.st value.'
						});
						this.selectedSalesRepUser = '';
						this.selectedSalesRepCode = '';
						return;
					}
					this.selectedSalesRepCode = code;
					this.salesScopeMode = 'rep';
					this.refreshScopeAndBadges();
				},
				
				
				
				
				toggleFutureHorizonMode() {
					this.futureHorizonMode = (this.futureHorizonMode === 'future') ? 'tomorrow' : 'future';

					let today = new Date();
					let tomorrow = new Date(today);
					tomorrow.setDate(tomorrow.getDate() + 1);
					let tomorrowStr = tomorrow.getFullYear() + '-' +
									  String(tomorrow.getMonth() + 1).padStart(2, '0') + '-' +
									  String(tomorrow.getDate()).padStart(2, '0');

					// If the grid is currently on a Future/Tomorrow due-date filter,
					// rewrite only that date operator so the visible rows match the switch.
					// Assign uses due_date >= yesterday, so it is left alone.
					const dueIdx = this.activeFilters.findIndex(f => f.field === 'due_date');
					if (dueIdx !== -1) {
						const f = this.activeFilters[dueIdx];
						const isFutureStyle = (
							(f.operator === 'gte' || f.operator === 'equals') &&
							String(f.value) === tomorrowStr
						);
						if (isFutureStyle) {
							this.activeFilters.splice(dueIdx, 1, {
								field: 'due_date',
								operator: (this.futureHorizonMode === 'tomorrow') ? 'equals' : 'gte',
								value: tomorrowStr
							});
						}
					}

					this.currentPage = 1;
					// Same work as the toolbar Refresh button: reload table + Today and Future badges.
					this.manualRefresh();
				},
				
				loadScopeRepUsers() {
					const load = (groupType, optionsKey) => {
						frappe.call({
							method: 'my_custom_app.procurement_panel.get_scope_rep_users',
							args: { group_type: groupType },
							callback: (r) => {
								if (r.message && r.message.status === 'success') {
									this[optionsKey] = r.message.data || [];
								} else {
									this[optionsKey] = [];
								}
							}
						});
					};
					if (this.canToggleProcScope) {
						load('procurement', 'procRepOptions');
					}
					if (this.canToggleSalesScope) {
						load('sales', 'salesRepOptions');
					}
				},

				manualRefresh() {
					this.holdVisibleRecords = false;
					this.supplierData = {}; // Clear all cached supplier data to force a fresh fetch
					this.fetchData();
					this.fetchQuickFilterBadges();
					// Main Dashboard fetching removed entirely to optimize performance
				},
				
				// ========== EXPORT ALL SEARCHED RESULTS ==========
				openExportSearchedModal() {
					if (!this.canExport) {
						frappe.msgprint({ title: 'Permission Denied', indicator: 'red', message: 'You do not have export rights.' });
						return;
					}
					if (this.loading || this.isExportingAll) return;

					const total = this.totalRecords || 0;
					if (total === 0) {
						frappe.msgprint({ title: 'Nothing to export', indicator: 'orange', message: 'No records match the current filters.' });
						return;
					}

					// Reset the four flags so the user starts with a clean choice each time
					this.exportIncludeRequestData     = false;
					this.exportIncludeSupplierData    = false;
					this.exportIncludeQuotationData   = false;
					this.exportIncludeSalesOrderData  = false;

					this.showExportOptionsModal = true;
				},
				
				
				startSearchProgress() {
					this.stopSearchProgress();
					this.isSearching = true;
					this.searchProgress = 8;
					this.searchProgressTimer = setInterval(() => {
						if (this.searchProgress < 90) {
							const remaining = 90 - this.searchProgress;
							this.searchProgress += Math.max(1, Math.round(remaining * 0.12));
							if (this.searchProgress > 90) this.searchProgress = 90;
						}
					}, 180);
				},

				finishSearchProgress() {
					this.stopSearchProgress();
					this.searchProgress = 100;
					setTimeout(() => {
						this.isSearching = false;
						this.searchProgress = 0;
					}, 250);
				},

				stopSearchProgress() {
					if (this.searchProgressTimer) {
						clearInterval(this.searchProgressTimer);
						this.searchProgressTimer = null;
					}
				},

				applyGlobalSearch() {
					const q = (this.searchInput || '').trim();
					if (!q) {
						this.clearGlobalSearch();
						return;
					}
					if (q.length < 2) {
						frappe.msgprint({
							title: 'Search too short',
							indicator: 'orange',
							message: 'Type at least 2 characters. Short searches scan the whole table and are too expensive.'
						});
						return;
					}

					this.searchQuery = q;
					this.searchInput = q;

					this.activeFilters = [];
					this.showFilterMenu = false;
					this.activeAlertFilter = null;
					this.headerCustomerToggle = false;
					this.selectedIds = [];
					this.currentPage = 1;

					this.startSearchProgress();
					this.fetchData();
				},

				clearGlobalSearch() {
					this.searchInput = '';
					this.searchQuery = '';
					this.stopSearchProgress();
					this.isSearching = false;
					this.searchProgress = 0;
					this.resetDefaultSortIfUnfiltered();
					this.currentPage = 1;
					this.fetchData();
				},

				confirmExportSearched() {
					this.showExportOptionsModal = false;
					this._doExportAllSearched();
				},

				_doExportAllSearched() {
					this.isExportingAll = true;

					const isProcurement = this.userMode === 'procurement';
					const methodName = isProcurement
						? 'my_custom_app.procurement_panel.get_quotes'
						: 'my_custom_app.procurement_panel.get_sales_rfq_records';

					// Same filter injection that fetchData uses (header customer toggle, etc.)
					const committedSearch = (this.searchQuery || '').trim();
					let injectedFilters = [];
					if (!committedSearch) {
						injectedFilters = JSON.parse(JSON.stringify(this.activeFilters));
						if (this.userMode === 'sales' && this.headerCustomerToggle && this.headerSelectedCustomer) {
							const hasCust = injectedFilters.some(f => f.field === 'customer' && f.operator === 'equals' && f.value === this.headerSelectedCustomer);
							if (!hasCust) {
								injectedFilters.push({ field: 'customer', operator: 'equals', value: this.headerSelectedCustomer });
							}
						}
					}

					const batchSize = 2000;          // safe chunk size for main rows
					const maxRecords = Math.min(this.totalRecords || 15000, 15000); // hard safety cap
					let allRows = [];
					let currentPage = 1;
					const totalPagesNeeded = Math.ceil(maxRecords / batchSize);

					const fetchNextBatch = () => {
						if (currentPage > totalPagesNeeded || allRows.length >= maxRecords) {
							// All main rows collected → optionally fetch related data, then build Excel
							this._fetchRelatedDataThenBuild(allRows, isProcurement);
							return;
						}

						frappe.call({
							method: methodName,
							args: {
								page: currentPage,
								page_length: batchSize,
								sort_by: this.sortField,
								sort_order: this.sortOrder,
								search_query: committedSearch || null,
								search_scope: this.userMode,
								filters: JSON.stringify(injectedFilters),
								skip_count: 1          // we already know the total
							},
							callback: (r) => {
								if (r.message && r.message.status === 'success' && Array.isArray(r.message.data)) {
									allRows = allRows.concat(r.message.data);
									currentPage++;
									// small delay so we don’t hammer the server
									setTimeout(fetchNextBatch, 120);
								} else {
									this.isExportingAll = false;
									frappe.msgprint({
										title: 'Export Failed',
										indicator: 'red',
										message: (r.message && r.message.error) || 'Could not retrieve data for export.'
									});
								}
							},
							error: () => {
								this.isExportingAll = false;
								frappe.msgprint({ title: 'Network Error', indicator: 'red', message: 'Failed while fetching export data.' });
							}
						});
					};

					// Start the first batch
					fetchNextBatch();
				},

				/**
				 * After main rows are collected, optionally load Supplier / Sales-Order data
				 * in batches of 1000 IDs, then hand everything to the Excel builder.
				 */
				_fetchRelatedDataThenBuild(allRows, isProcurement) {
					const includeSuppliers   = isProcurement && this.exportIncludeSupplierData;
					const includeSalesOrders = !isProcurement && this.exportIncludeSalesOrderData;

					if (!includeSuppliers && !includeSalesOrders) {
						this._buildAndDownloadExcel(allRows, isProcurement, {}, {});
						this.isExportingAll = false;
						return;
					}

					const allIds = allRows.map(r => String(r.ID));
					const relatedBatchSize = 1000;
					let relatedMap = {};          // id → array of supplier rows  OR  id → array of SO rows
					let idx = 0;

					const fetchRelatedBatch = () => {
						if (idx >= allIds.length) {
							// All related data collected
							const supplierMap = includeSuppliers   ? relatedMap : {};
							const orderMap    = includeSalesOrders ? relatedMap : {};
							this._buildAndDownloadExcel(allRows, isProcurement, supplierMap, orderMap);
							this.isExportingAll = false;
							return;
						}

						const slice = allIds.slice(idx, idx + relatedBatchSize);
						idx += relatedBatchSize;

						const method = includeSuppliers
							? 'my_custom_app.procurement_panel.get_quote_suppliers'
							: 'my_custom_app.procurement_panel.get_customer_orders';

						frappe.call({
							method: method,
							args: { item_ids: JSON.stringify(slice) },
							callback: (r) => {
								if (r.message && r.message.status === 'success' && r.message.data) {
									Object.assign(relatedMap, r.message.data);
								}
								setTimeout(fetchRelatedBatch, 80);
							},
							error: () => {
								// Continue even if one batch fails – we still export what we have
								setTimeout(fetchRelatedBatch, 80);
							}
						});
					};

					fetchRelatedBatch();
				},

				_buildAndDownloadExcel(rows, isProcurement, supplierMap = {}, orderMap = {}) {
					if (!rows || rows.length === 0) {
						frappe.msgprint({ title: 'Empty export', indicator: 'orange', message: 'No rows were returned.' });
						return;
					}

					const includeRequestData   = isProcurement && this.exportIncludeRequestData;
					const includeQuotationData = !isProcurement && this.exportIncludeQuotationData;
					const includeSuppliers     = isProcurement && this.exportIncludeSupplierData;
					const includeSalesOrders   = !isProcurement && this.exportIncludeSalesOrderData;

					// ---- Base headers (identical to the selected-row export) ----
					let baseHeaders = [];
					if (isProcurement) {
						baseHeaders = [
							'ID', 'REF', 'CUSTOM_SALES_STATUS', 'DUE_DATE', 'DUE_TIME', 'REP', 'SAP',
							'ITEM', 'QTY', 'UNIT', 'BRAND', 'PART_NUMBER', 'DESCRIPTION', 'CO',
							'APROX_WEIGHT', 'SALES_PRICE', 'DELIVERY', 'INCOTERM',
							'PROCUREMENT_STATUS', 'TEST', 'ORIG_NOTE', 'NOTE'
						];
					} else {
						baseHeaders = [
							'ID', 'REF', 'CUSTOM_SALES_STATUS', 'CUSTOMER', 'DIV', 'COUNTRY',
							'CONTACT', 'EMAIL_CUSTOMER', 'CUSTOMER_REF',
							'DATE', 'DUE_DATE', 'DUE_TIME', 'ST', 'SAP', 'ITEM', 'QTY', 'UNIT',
							'BRAND', 'PART_NUMBER', 'DESCRIPTION', 'INCOTERM', 'NOTE',
							'SALE_PRICE', 'REFERENCE_PRICE', 'DATE_REQ',
							'QUOTATION_SALES_PRICE', 'PROCUREMENT_STATUS'
						];
					}

					let finalHeaders = [...baseHeaders];

					// Request Data (Procurement) – columns already present on the main row
					if (includeRequestData) {
						finalHeaders = finalHeaders.concat([
							'CUSTOMER', 'DIV', 'CONTACT', 'EMAIL_CUSTOMER', 'DATE', 'RP', 'ST', 'SALE_PRICE',
							'ORIG_ITEM', 'ORIG_QTY', 'ORIG_UNIT', 'ORIG_BRAND', 'ORIG_PART_NUMBER',
							'ORIG_DESCRIPTION', 'ORIG_NOTE'
						]);
					}

					// Quotation Data (Sales) – columns already present on the main row
					if (includeQuotationData) {
						finalHeaders = finalHeaders.concat([
							'QUOTE_ITEM', 'QUOTE_QTY', 'QUOTE_UNIT', 'QUOTE_BRAND', 'QUOTE_PART_NUMBER',
							'QUOTE_CO', 'QUOTE_APROX_WEIGHT', 'QUOTE_INCOTERM', 'QUOTE_DELIVERY',
							'QUOTE_DESCRIPTION', 'QUOTE_NOTE'
						]);
					}

					// Supplier Data columns
					if (includeSuppliers) {
						finalHeaders = finalHeaders.concat([
							'SUPPLIER_NAME', 'SUPPLIER_CONTACT', 'SUPPLIER_EMAIL', 'COST_EA',
							'LOGISTICS_FEE', 'SUPPLIER_DELIVERY', 'INCOTERMS', 'ADDITIONAL_FEES', 'SUPPLIER_NOTED'
						]);
					}

					// Sales Order Data columns
					if (includeSalesOrders) {
						finalHeaders = finalHeaders.concat([
							'SO_ORDER_NUMBER', 'SO_DATE', 'SO_ORDER_DUE_DATE', 'SO_MODIFICATION',
							'SO_ORDER_PRICE_EA', 'SO_NOTE_ORDER'
						]);
					}

					// ---- Build expanded rows ----
					const exportData = [];

					rows.forEach(mainRow => {
						const id = String(mainRow.ID);

						// Base values
						let baseValues = {};
						baseHeaders.forEach(h => {
							if (h === 'DATE_REQ') {
								const raw = mainRow['DATE REQ'] !== undefined && mainRow['DATE REQ'] !== null
									? mainRow['DATE REQ']
									: (mainRow.DATE_REQ !== undefined && mainRow.DATE_REQ !== null ? mainRow.DATE_REQ : '');
								baseValues[h] = String(raw);
							} else if (h === 'QUOTATION_SALES_PRICE') {
								baseValues[h] = mainRow.SALES_PRICE !== undefined && mainRow.SALES_PRICE !== null
									? String(mainRow.SALES_PRICE)
									: '';
							} else {
								baseValues[h] = mainRow[h] !== undefined && mainRow[h] !== null ? String(mainRow[h]) : '';
							}
						});

						// Inject Request Data fields
						if (includeRequestData) {
							baseValues['CUSTOMER']         = mainRow.CUSTOMER || '';
							baseValues['DIV']              = mainRow.DIV || '';
							baseValues['CONTACT']          = mainRow.CONTACT || '';
							baseValues['EMAIL_CUSTOMER']   = mainRow.EMAIL_CUSTOMER || '';
							baseValues['DATE']             = mainRow.DATE || '';
							baseValues['RP']               = mainRow.RP || '';
							baseValues['ST']               = mainRow.ST || '';
							baseValues['SALE_PRICE']       = mainRow.SALE_PRICE || '';
							baseValues['ORIG_ITEM']        = mainRow.ORIG_ITEM || '';
							baseValues['ORIG_QTY']         = mainRow.ORIG_QTY || '';
							baseValues['ORIG_UNIT']        = mainRow.ORIG_UNIT || '';
							baseValues['ORIG_BRAND']       = mainRow.ORIG_BRAND || '';
							baseValues['ORIG_PART_NUMBER'] = mainRow.ORIG_PART_NUMBER || '';
							baseValues['ORIG_DESCRIPTION'] = mainRow.ORIG_DESCRIPTION || '';
							baseValues['ORIG_NOTE']        = mainRow.ORIG_NOTE || '';
						}

						// Inject Quotation Data fields
						if (includeQuotationData) {
							baseValues['QUOTE_ITEM']         = mainRow.QUOTE_ITEM || '';
							baseValues['QUOTE_QTY']          = mainRow.QUOTE_QTY || '';
							baseValues['QUOTE_UNIT']         = mainRow.QUOTE_UNIT || '';
							baseValues['QUOTE_BRAND']        = mainRow.QUOTE_BRAND || '';
							baseValues['QUOTE_PART_NUMBER']  = mainRow.QUOTE_PART_NUMBER || '';
							baseValues['QUOTE_CO']           = mainRow.QUOTE_CO || '';
							baseValues['QUOTE_APROX_WEIGHT'] = mainRow.QUOTE_APROX_WEIGHT || '';
							baseValues['QUOTE_INCOTERM']     = mainRow.QUOTE_INCOTERM || '';
							baseValues['QUOTE_DELIVERY']     = mainRow.QUOTE_DELIVERY || '';
							baseValues['QUOTE_DESCRIPTION']  = mainRow.QUOTE_DESCRIPTION || '';
							baseValues['QUOTE_NOTE']         = mainRow.QUOTE_NOTE || '';
						}

						// Case 1 – no related data → single row
						if (!includeSuppliers && !includeSalesOrders) {
							exportData.push(baseValues);
							return;
						}

						// Case 2 – Supplier Data (Procurement) → one row per supplier
						if (includeSuppliers) {
							const suppliers = supplierMap[id] || [];
							if (suppliers.length === 0) {
								exportData.push({ ...baseValues });
							} else {
								suppliers.forEach(sup => {
									exportData.push({
										...baseValues,
										SUPPLIER_NAME:     sup.SUPPLIER_NAME || '',
										SUPPLIER_CONTACT:  sup.CONTACT || '',
										SUPPLIER_EMAIL:    sup.EMAIL_CONTACT || '',
										COST_EA:           sup.COST_EA || '',
										LOGISTICS_FEE:     sup.LOGISTICS_FEE || '',
										SUPPLIER_DELIVERY: sup.DELIVERY || '',
										INCOTERMS:         sup.INCOTERMS || '',
										ADDITIONAL_FEES:   sup.ADDITIONAL_FEES || '',
										SUPPLIER_NOTED:    sup.NOTED || ''
									});
								});
							}
						}

						// Case 3 – Sales Order Data (Sales) → one row per order
						if (includeSalesOrders) {
							const orders = orderMap[id] || [];
							if (orders.length === 0) {
								exportData.push({ ...baseValues });
							} else {
								orders.forEach(ord => {
									exportData.push({
										...baseValues,
										SO_ORDER_NUMBER:   ord.ORDER_NUMBER || '',
										SO_DATE:           ord.DATE || '',
										SO_ORDER_DUE_DATE: ord.ORDER_DUE_DATE || '',
										SO_MODIFICATION:   ord.MODIFICATION || '',
										SO_ORDER_PRICE_EA: ord.ORDER_PRICE_EA || '',
										SO_NOTE_ORDER:     ord.NOTE_ORDER || ''
									});
								});
							}
						}
					});

					// ---- Write XLSX (same for both views) ----
					const orderedData = exportData.map(rowObj => {
						const ordered = {};
						finalHeaders.forEach(h => {
							ordered[h] = rowObj[h] !== undefined ? rowObj[h] : '';
						});
						return ordered;
					});

					const ws = XLSX.utils.json_to_sheet(orderedData, { header: finalHeaders });
					const wb = XLSX.utils.book_new();
					XLSX.utils.book_append_sheet(wb, ws, "Searched Results");

					const modeLabel = isProcurement ? 'procurement' : 'sales';
					const dateStamp = new Date().toISOString().split('T')[0];
					XLSX.writeFile(wb, `glnet_${modeLabel}_searched_${dateStamp}.xlsx`);

					frappe.show_alert({
						message: `Exported ${orderedData.length.toLocaleString()} row(s)`,
						indicator: 'green'
					});
				},

					// Sales-only header state

					frappe.show_alert({

				fetchData() {
					this.loading = true; 
					this.selectedIds = [];
					
					// Invalidate every in-flight get_quotes / get_sales_rfq_records callback.
					// The previous unfiltered (or previously filtered) request is what was
					// painting random/older rows on top of a successful filter result.
					const requestId = ++this.fetchGeneration;
					
					// Wipe UI states to speed up DOM rendering and close active edits/sub-tables
					this.editingRows = {};
					this.expandedRows = {};
					this.activeTab = {};
					this.supplierData = {};
					
					// Dynamically choose backend endpoint based on current view mode
					let methodName = (this.userMode === 'sales') 
						? 'my_custom_app.procurement_panel.get_sales_rfq_records' 
						: 'my_custom_app.procurement_panel.get_quotes';

					const committedSearch = (this.searchQuery || '').trim();

					let injectedFilters = [];
					if (!committedSearch) {
						injectedFilters = JSON.parse(JSON.stringify(this.activeFilters));
						if (this.userMode === 'sales' && this.headerCustomerToggle && this.headerSelectedCustomer) {
							let hasCust = injectedFilters.some(f => f.field === 'customer' && f.operator === 'equals' && f.value === this.headerSelectedCustomer);
							if (!hasCust) {
								injectedFilters.push({ field: 'customer', operator: 'equals', value: this.headerSelectedCustomer });
							}
						}
					}

					let baseArgs = {
						page: this.currentPage, 
						page_length: this.pageLength, 
						sort_by: this.sortField, 
						sort_order: this.sortOrder, 
						search_query: committedSearch || null,
						search_scope: this.userMode,
						filters: JSON.stringify(injectedFilters)
					};

					// ========== TIMING START (same style as upload report) ==========
					const t0_data = performance.now();
					let t0_count = null;          // will be set only if the count call is fired
					const triggerLabel = this.lastBadgeTrigger
						? this.lastBadgeTrigger.label
						: (this.activeFilters.length ? 'manual-filter / search' : 'no-filter');
					const modeLabel = this.userMode === 'sales' ? 'SALES' : 'PROCUREMENT';
					// ================================================================

					const hasFilterOrSearch = (this.activeFilters.length > 0 || !!this.searchQuery || !!committedSearch);
					if (hasFilterOrSearch) {
						this.totalRecordsPending = true;
					} else {
						this.totalRecordsPending = false;
					}

					// -------------------------------------------------------
					// 1. Fast path – get the page data only (skip the COUNT)
					// -------------------------------------------------------
					let dataArgs = Object.assign({}, baseArgs, { skip_count: 1, count_only: 0 });
					frappe.call({
						method: methodName,
						args: dataArgs,
						callback: (r) => {
							// Stale response from an earlier filter / page / view — do not touch the grid
							if (requestId !== this.fetchGeneration) {
								this.panelDebug(() => {
									console.log('Ignored stale page-data response', requestId, this.fetchGeneration);
								});
								return;
							}

							const dataElapsed = ((performance.now() - t0_data) / 1000).toFixed(3);

							this.loading = false;
							if (this.isSearching) {
								this.finishSearchProgress();
							}
							if (r.message && r.message.status === 'success') {
								this.records = r.message.data || [];

								if (r.message.total_records !== null && r.message.total_records !== undefined) {
									this.totalPages = r.message.total_pages;
									this.totalRecords = r.message.total_records;
									this.totalRecordsPending = false;
								} else if (
									this.currentPage === 1 &&
									hasFilterOrSearch &&
									this.records.length < this.pageLength
								) {
									// Short first page: this IS the full filtered set.
									// Update the counter immediately; do not keep 500000.
									this.totalRecords = this.records.length;
									this.totalPages = 1;
									this.totalRecordsPending = false;
								}

								} else {
									frappe.msgprint({title: 'Backend Error', indicator: 'red', message: r.message.error || 'Failed to fetch data.'});
								}

							// ---------- Console timing report (data call, Administrator only) ----------
							this.panelDebug(() => {
								console.group(`%c⏱ Quick-Filter Data Timing  [${modeLabel}]`, "color:#0d6efd;font-weight:bold;font-size:13px");
								console.log(`%cTriggered by: ${triggerLabel}`, "font-weight:bold");
								console.log(`%cPage data call: ${dataElapsed} s`, dataElapsed > 1.5 ? "color:red;font-weight:bold" : "color:green");
								console.log("Active filters:", JSON.parse(JSON.stringify(this.activeFilters)));
								console.log("Page / Length / Sort:", this.currentPage, this.pageLength, this.sortField, this.sortOrder);
								if (r.message && r.message.total_records != null) {
									console.log("Records returned (this page):", (r.message.data || []).length, " | total_records from this call:", r.message.total_records);
								}
								console.groupEnd();
							});
							// -------------------------------------------------------
						}
					});

					// -------------------------------------------------------
					// 2. Background call – get the accurate total only
					// -------------------------------------------------------
					// Only fire this when filters or a search query are present.
					// When there are no filters/search, the first call already returns total_records = 500000
					// (see the backend change for get_quotes / get_sales_rfq_records).
					if (hasFilterOrSearch) {
						t0_count = performance.now();
						let countArgs = Object.assign({}, baseArgs, { skip_count: 0, count_only: 1 });
						frappe.call({
							method: methodName,
							args: countArgs,
							callback: (r) => {
								// Stale count from an earlier filter — do not rewrite pagination
								if (requestId !== this.fetchGeneration) {
									this.panelDebug(() => {
										console.log('Ignored stale count response', requestId, this.fetchGeneration);
									});
									return;
								}

								const countElapsed = ((performance.now() - t0_count) / 1000).toFixed(3);

								if (r.message && r.message.status === 'success' &&
									r.message.total_records !== null && r.message.total_records !== undefined) {
									this.totalRecords = r.message.total_records;
									this.totalPages = r.message.total_pages;
									this.totalRecordsPending = false;
								} else {
									this.totalRecordsPending = false;
								}

								// ---------- Console timing report (count call, Administrator only) ----------
								this.panelDebug(() => {
									console.group(`%c⏱ Quick-Filter COUNT Timing  [${modeLabel}]`, "color:#6f42c1;font-weight:bold;font-size:13px");
									console.log(`%cTriggered by: ${triggerLabel}`, "font-weight:bold");
									console.log(`%cAccurate COUNT call: ${countElapsed} s`, countElapsed > 2.0 ? "color:red;font-weight:bold" : "color:green");
									console.log("total_records returned:", r.message && r.message.total_records);
									console.groupEnd();
								});
								// -------------------------------------------------------
							}
						});
					}

					// Clear the badge trigger after we have captured it for the reports above
					this.lastBadgeTrigger = null;
				},

				drawConnections() {
					this.activeConnections = [];
					// DOM querying to draw lines between currently rendered elements
					if (this.activeMapSupplier) {
						let supEl = document.getElementById('sup-' + this.activeMapSupplier);
						if (!supEl) return;
						let supRect = supEl.getBoundingClientRect();
						
						this.mappedBrands.forEach(b => {
							let brandEl = document.getElementById('brand-' + b.name);
							if (brandEl) {
								let brandRect = brandEl.getBoundingClientRect();
								this.activeConnections.push({
									supplier: this.activeMapSupplier, brand: b.name,
									x1: supRect.right, y1: supRect.top + (supRect.height/2),
									x2: brandRect.left, y2: brandRect.top + (brandRect.height/2)
								});
							}
						});
					} else if (this.activeMapBrand) {
						let brandEl = document.getElementById('brand-' + this.activeMapBrand);
						if (!brandEl) return;
						let brandRect = brandEl.getBoundingClientRect();
						
						this.mappedSuppliers.forEach(s => {
							let supEl = document.getElementById('sup-' + s.name);
							if (supEl) {
								let supRect = supEl.getBoundingClientRect();
								this.activeConnections.push({
									supplier: s.name, brand: this.activeMapBrand,
									x1: supRect.right, y1: supRect.top + (supRect.height/2),
									x2: brandRect.left, y2: brandRect.top + (brandRect.height/2)
								});
							}
						});
					}
				},

				toggleAlertFilter(type) {
					if (this.activeAlertFilter === type) {

				handleInternalUpload(event, row) {
					const files = event.target.files;
					if (!files || files.length === 0) return;

					let processedFiles = [];
					let filesRead = 0;

					// Loop through all selected files
					for (let i = 0; i < files.length; i++) {
						const file = files[i];
						const reader = new FileReader();
						
						reader.onload = (e) => {
							// Strip the base64 prefix
							const base64Data = e.target.result.split(',')[1];
							
							// Clean up the filename for the "corrected name" field (removes the .pdf extension)
							const cleanName = file.name.replace(/\.[^/.]+$/, "");

							processedFiles.push({
								filename: file.name,
								filedata: base64Data,
								part_number: row.PART_NUMBER || '',
								corrected_name: cleanName 
							});

							filesRead++;
							
							// Once all files are loaded into memory, send them to Python
							if (filesRead === files.length) {
								frappe.call({
									method: 'my_custom_app.procurement_panel.upload_internal_attachments',
									args: {
										quote_id: row.ID,
										sap: row.SAP || '',
										payload: JSON.stringify(processedFiles)
									},
									callback: (r) => {
										if (r.message && r.message.status === 'success') {
											frappe.show_alert({message: r.message.message, indicator: 'green'});
											// Clear the input so the same files can be selected again if needed
											event.target.value = '';
										} else {
											frappe.msgprint({title: 'Upload Failed', indicator: 'red', message: r.message.error});
										}
									}
								});
							}
						};
						reader.readAsDataURL(file);
					}
				},

					if (ext === 'pdf') return 'fa-file-pdf';

					if (['xls', 'xlsx', 'csv'].includes(ext)) return 'fa-file-excel';
					if (['png', 'jpg', 'jpeg', 'gif'].includes(ext)) return 'fa-file-image';
					return 'fa-file-alt';

					if (['xls', 'xlsx', 'csv'].includes(ext)) return 'color: #198754;'; // Green

				applyPersonalizedFilter(group, type, dueSoonRange) {
					// Mode-aware guard — uses the active scope code (self or selected rep)
					if (this.userMode === 'sales') {
						// Only enforce ST for true Sales-group users.
						// Purchasing users who toggled into Sales view are allowed
						// to see the badges (they simply get no ST personalisation).
						if (!this.getActiveSalesCode() && this.isSalesUser && !this.isAdmin && this.salesScopeMode !== 'global') {
							frappe.msgprint({title: 'Missing ST Code', indicator: 'orange', message: 'No ST code associated with the active scope user.'});
							return;
						}
					} else {
						if (!this.getActiveProcCode() && !this.isAdmin && this.procScopeMode !== 'global') {
							frappe.msgprint({title: 'Missing Rep Code', indicator: 'orange', message: 'No Rep code associated with the active scope user.'});
							return;
						}
					}
					let today = new Date();
					// Use local calendar date – never UTC
					let dateStr = today.getFullYear() + '-' +
								  String(today.getMonth() + 1).padStart(2, '0') + '-' +
								  String(today.getDate()).padStart(2, '0');
					let newFilters = [];
					// ------------------------------------------------------------------
					// SPECIAL CASE: Assign badge
					// - NEVER add "Rep Equals"
					// - due_date >= (today - 1 day)
					// - rep is empty
					// ------------------------------------------------------------------
					if (type === 'assign') {
						let yesterday = new Date(today);
						yesterday.setDate(yesterday.getDate() - 1);
						let yesterdayStr = yesterday.getFullYear() + '-' +
										   String(yesterday.getMonth() + 1).padStart(2, '0') + '-' +
										   String(yesterday.getDate()).padStart(2, '0');
						newFilters = [
							{ field: 'due_date', operator: 'gte', value: yesterdayStr },
							{ field: 'rep', operator: 'is_empty', value: '' }
						];
					} else if (type === 'escalated') {
						// No date restriction – show every escalated record the user is allowed to see.
						// Status is stored as the exact value "E" (see escalate_records).
						newFilters = [
							{ field: 'procurement_status', operator: 'equals', value: 'E' }
						];
						// Personal / selected-rep scope only — Global T3 must not get "Rep Equals"
						if (this.shouldApplyProcRepFilter()) {
							newFilters.unshift({ field: 'rep', operator: 'equals', value: this.getActiveProcCode(), fromScope: true });
						}
					} else if (group === 'today' && type === 'uploaded') {
						// Sales Today Uploaded: request date = today, ignore due_date.
						// Still follows Scope (Global / Personal / selected Rep).
						newFilters = [
							{ field: 'date', operator: 'equals', value: dateStr }
						];
						if (this.userMode === 'sales') {
							if (this.shouldApplySalesRefFilter()) {
								newFilters.unshift({ field: 'ref', operator: 'contains', value: this.getActiveSalesRefNeedle(), fromScope: true });
							}
						} else if (this.shouldApplyProcRepFilter()) {
							newFilters.unshift({ field: 'rep', operator: 'equals', value: this.getActiveProcCode(), fromScope: true });
						}
					} /* else if (type === 'has_order') {
						// DISABLED – restore with the Orders badge
						// No date restriction – every RAQ that has at least one Customer Order row.
						newFilters = [
							{ field: 'has_customer_order', operator: 'equals', value: '1' }
						];
						if (this.userMode === 'sales') {
							if (this.shouldApplySalesRefFilter()) {
								newFilters.unshift({ field: 'ref', operator: 'contains', value: this.getActiveSalesRefNeedle(), fromScope: true });
							}
						} else {
							if (this.shouldApplyProcRepFilter()) {
								newFilters.unshift({ field: 'rep', operator: 'equals', value: this.getActiveProcCode(), fromScope: true });
							}
						}
					} */ else {
						// ------------------------------------------------------------------
						// All other badges (Today / Future Total / W / Empty / Z / VOC / X / Due Soon)
						// ------------------------------------------------------------------
						let dateOperator = 'equals';
						let dateValue = dateStr;
						if (group === 'future') {
							let tomorrow = new Date(today);
							tomorrow.setDate(tomorrow.getDate() + 1);
							dateValue = tomorrow.getFullYear() + '-' +
										String(tomorrow.getMonth() + 1).padStart(2, '0') + '-' +
										String(tomorrow.getDate()).padStart(2, '0');
							// Future = due_date >= tomorrow
							// Tomorrow switch = due_date equals tomorrow
							dateOperator = (this.futureHorizonMode === 'tomorrow') ? 'equals' : 'gte';
						}
						newFilters = [
							{ field: 'due_date', operator: dateOperator, value: dateValue }
						];
						// Personalise on the correct field according to view mode
						if (this.userMode === 'sales') {
							if (this.shouldApplySalesRefFilter()) {
								newFilters.unshift({ field: 'ref', operator: 'contains', value: this.getActiveSalesRefNeedle(), fromScope: true });
							}
						} else {
							// Procurement – exact match on rep.
							// Toggle owns this: Global T3 = no tag, Personal / Rep / T1 / T2 = add tag.
							// The old T3 X's exception is removed on purpose.
							if (this.shouldApplyProcRepFilter()) {
								newFilters.unshift({ field: 'rep', operator: 'equals', value: this.getActiveProcCode(), fromScope: true });
							}
						}
						if (type === 'w') {
							// Status now lives in procurement_status
							newFilters.push({ field: 'procurement_status', operator: 'contains', value: 'w' });
						} else if (type === 'empty') {
							newFilters.push({ field: 'procurement_status', operator: 'is_empty', value: '' });
						} else if (type === 'z') {
							newFilters.push({ field: 'ref', operator: 'contains', value: 'z' });
						} else if (type === 'voc') {
							newFilters.push({ field: 'ref', operator: 'regex', value: '^[a-zA-Z0-9]+-[0-9]+-(VOC|V|P|B|F)[a-zA-Z0-9]+' });
						} else if (type === 'xs') {
							// Status now lives in procurement_status
							newFilters.push({ field: 'procurement_status', operator: 'contains', value: 'x' });
						} else if (type === 'due_soon') {
							// ---------------------------------------------------------------
							// New range handling that matches the visual colour segments
							// dueSoonRange can be: 3 | 5 | 'overdue' | 'all' | undefined
							// ---------------------------------------------------------------
							this.sortField = 'DUE_TIME';
							this.sortOrder = 'asc';
							// Default to the urgent window when the main button is clicked
							if (dueSoonRange === undefined || dueSoonRange === null) {
								dueSoonRange = 3;
							}
							if (dueSoonRange === 'all') {
								// No extra time filter – just everything due today (previous behaviour)
							} else if (dueSoonRange === 'overdue') {
								// Already past the due time today
								let nowTime = today.toTimeString().split(' ')[0]; // "HH:MM:SS"
								newFilters.push({ field: 'due_time', operator: 'lte', value: nowTime });
							} else {
								// Numeric hours remaining (3 or 5)
								let hours = parseInt(dueSoonRange, 10) || 3;
								let future = new Date(today.getTime() + hours * 60 * 60 * 1000);
								let futureTime = future.toTimeString().split(' ')[0]; // "HH:MM:SS"
								// due_time must still be in the future AND within the chosen window
								let nowTime = today.toTimeString().split(' ')[0];
								newFilters.push({ field: 'due_time', operator: 'gte', value: nowTime });
								newFilters.push({ field: 'due_time', operator: 'lte', value: futureTime });
							}
							// Procurement and Sales: empty/null OR W-WAITING.
							newFilters.push({
								field: 'due_soon_open_status',
								operator: 'equals',
								value: 'empty_or_W-WAITING'
							});
							
						} else if (type === 'pending_sub') {
							newFilters.push({
								field: 'pending_submission',
								operator: 'equals',
								value: 'Q-QUOTED and not S-SUBMITTED, C-CLOSED, or A-AWARDED'
							});
						}
					}
					this.searchQuery = '';
					this.searchInput = '';
					this.activeFilters = newFilters;
					this.currentPage = 1;
					// Record which badge caused this fetch so the timing report can identify it
					this.lastBadgeTrigger = {
						group: group,
						type: type,
						range: dueSoonRange,
						label: group + '/' + type + (dueSoonRange ? '/' + dueSoonRange : '')
					};
					this.pendingXsAutoEdit = false;
					this.acknowledgeBadgeAlert(group, type);
					this.fetchData();
					},
				
				applySalesFilter(type) {

					let today = new Date();

				handleDoctypeUpload(event, row, doctype, type) {
					const files = event.target.files;
					if (!files || files.length === 0) return;

					let processedFiles = [];
					let filesRead = 0;

					for (let i = 0; i < files.length; i++) {
						const file = files[i];
						const reader = new FileReader();
						
						reader.onload = (e) => {
							const base64Data = e.target.result.split(',')[1];
							processedFiles.push({
								filename: file.name,
								filedata: base64Data
							});

							filesRead++;
							
							if (filesRead === files.length) {
								frappe.call({
									method: 'my_custom_app.procurement_panel.upload_doctype_attachments',
									args: {
										doctype: doctype,
										docname: (type === 'supplier' || type === 'customer_order') ? row.DOC_NAME : row.ID,
										payload: JSON.stringify(processedFiles),
										fieldname: this.getAttachmentFieldname(type)
									},
									callback: (r) => {
										if (r.message && r.message.status === 'success') {
											frappe.show_alert({message: r.message.message, indicator: 'green'});
											event.target.value = '';
											if (type === 'rfq') row.RFQ_ATTACHMENT = r.message.new_attachment_str;
											else if (type === 'supplier') row.ATTACHMENTS = r.message.new_attachment_str;
											else if (type === 'customer_order') row.ATTACHMENT = r.message.new_attachment_str;
											else row.ATTACHMENT = r.message.new_attachment_str;
										} else {
											frappe.msgprint({title: 'Upload Failed', indicator: 'red', message: r.message.error});
										}
									}
								});
							}
						};
						reader.readAsDataURL(file);
					}
				},

				deleteDoctypeAttachment(idx) {
					if (!confirm("Are you sure you want to remove this file?")) return;
					this.isDeletingFile = idx;
					
					frappe.call({
						method: 'my_custom_app.procurement_panel.delete_doctype_attachment',
						args: { 
							doctype: this.activeDoctype, 
							docname: this.activeAttachmentRowId, 
							file_index: idx,

							if (r.message && r.message.status === 'success') {
								this.activeAttachments.splice(idx, 1);
								
								if (this.activeAttachmentRowType === 'supplier') {
									Object.keys(this.supplierData || {}).forEach((rid) => {
										(this.supplierData[rid] || []).forEach((sup) => {
											if (sup.DOC_NAME === this.activeAttachmentRowId) {
												sup.ATTACHMENTS = r.message.new_attachment_str;
											}
										});
									});
								} else if (this.activeAttachmentRowType === 'customer_order') {
									Object.keys(this.customerOrderData || {}).forEach((rid) => {
										(this.customerOrderData[rid] || []).forEach((ord) => {
											if (ord.DOC_NAME === this.activeAttachmentRowId) {
												ord.ATTACHMENT = r.message.new_attachment_str;
											}
										});
									});
								} else {
									let targetRow = this.records.find(rec => rec.ID === this.activeAttachmentRowId);
									if (targetRow) {
										if (this.activeAttachmentRowType === 'rfq') {
											targetRow.RFQ_ATTACHMENT = r.message.new_attachment_str;
										} else {
											targetRow.ATTACHMENT = r.message.new_attachment_str;

								frappe.show_alert({message: "File deleted successfully.", indicator: 'green'});

				viewAttachments(row, type, isEditing = false) {
					this.isEditingAttachments = isEditing;
					this.activeAttachmentRowType = type;

					if (type === 'supplier') {
						this.activeDoctype = 'Supplier Quote';
						this.activeAttachmentTable = "supplier quote";
						this.activeAttachmentRowId = row.DOC_NAME;
						var attachmentVal = row.ATTACHMENTS;
					} else if (type === 'customer_order') {
						this.activeDoctype = 'Customer Order';
						this.activeAttachmentTable = "customer order";
						this.activeAttachmentRowId = row.DOC_NAME;
						var attachmentVal = row.ATTACHMENT;
					} else {
						this.activeDoctype = 'Request And Quote';
						this.activeAttachmentTable = "request and quote";
						this.activeAttachmentRowId = row.ID;
						var attachmentVal = type === 'rfq' ? row.RFQ_ATTACHMENT : row.ATTACHMENT;
					}
					this.activeAttachments = [];

					if (!attachmentVal) {
						if (isEditing) this.showAttachmentModal = true;
						return;
					}

					try {
						// Normal path: field already contains a JSON array/object
						let parsed = typeof attachmentVal === 'string' ? JSON.parse(attachmentVal) : attachmentVal;
						if (Array.isArray(parsed)) {
							this.activeAttachments = parsed;
						} else if (typeof parsed === 'object' && parsed !== null) {
							this.activeAttachments = [parsed];
						}
						this.showAttachmentModal = true;
					} catch (e) {
						// Fallback for legacy / wrongly-saved plain file URLs (e.g. old clone records)
						if (typeof attachmentVal === 'string' &&
							(attachmentVal.startsWith('/files/') || attachmentVal.startsWith('http'))) {
							const fileName = attachmentVal.split('/').pop() || 'attachment';
							this.activeAttachments = [{
								name: fileName,
								usrName: fileName,
								file_url: attachmentVal
							}];
							this.showAttachmentModal = true;
						} else {
							frappe.msgprint({title: 'Parse Error', indicator: 'red', message: 'Could not read attachment format.'});
							console.error("Attachment JSON Error:", e);
						}
					}
				},
				
				
				getAttachmentFieldname(type) {
					if (type === 'rfq') return 'attachment';
					if (type === 'supplier') return 'attachments';
					if (type === 'customer_order') return 'attachment';
					return 'quotation_attachment';
				},
				
				
				forceDownloadUrl(url, fileName) {
					if (!url) return;
					const name = fileName || (String(url).split('/').pop() || 'download');

					fetch(url, { credentials: 'same-origin', cache: 'no-store' })
						.then((res) => {
							if (!res.ok) throw new Error('download fetch failed');
							const headerName = (res.headers.get('Content-Disposition') || '').match(/filename="?([^"]+)"?/i);
							return res.blob().then((blob) => ({
								blob,
								name: (headerName && headerName[1]) ? headerName[1] : name
							}));
						})
						.then(({ blob, name }) => {
							const objUrl = URL.createObjectURL(blob);
							const a = document.createElement('a');
							a.href = objUrl;
							a.download = name;
							a.rel = 'noopener';
							document.body.appendChild(a);
							a.click();
							document.body.removeChild(a);
							setTimeout(() => URL.revokeObjectURL(objUrl), 2000);
						})
						.catch(() => {
							const a = document.createElement('a');
							a.href = url;
							a.setAttribute('download', name);
							a.rel = 'noopener';
							document.body.appendChild(a);
							a.click();
							document.body.removeChild(a);
						});
				},
				
				downloadSingleFile(file) {
					let fileName = file.usrName || file.name;
					if (!fileName) return;

					let url;
					if (file.file_url) {
						url = file.file_url;
					} else {
						let baseUrl = "https://www.glgeneralindustries.com/glgeneral/intranet/mfhandler.php";
						url = `${baseUrl}?file=${encodeURIComponent(fileName)}&table=${encodeURIComponent(this.activeAttachmentTable)}&field=ATTACHMENT&pageType=list&key1=${this.activeAttachmentRowId}`;
					}

					this.forceDownloadUrl(url, fileName);
				},
				
				downloadAllAttachments() {
					if (!this.activeAttachments || this.activeAttachments.length === 0) return;
					
					this.activeAttachments.forEach((fileInfo, index) => {
						setTimeout(() => {
							this.downloadSingleFile(fileInfo);
						}, index * 1500); 
					});
				},
				
				
				fetchRowsForEdit(ids, callback) {
					const idList = [];
					(ids || []).forEach((id) => {
						const key = String(id);
						if (key && idList.indexOf(key) === -1) idList.push(key);
					});
					if (!idList.length) {
						if (callback) callback([]);
						return;
					}
					frappe.call({
						method: 'my_custom_app.procurement_panel.get_raq_rows_for_edit',
						args: {
							ids: JSON.stringify(idList),
							search_scope: this.userMode === 'sales' ? 'sales' : 'procurement'
						},
						callback: (r) => {
							const rows = (r.message && r.message.status === 'success' && r.message.data) ? r.message.data : [];
							if (!(r.message && r.message.status === 'success')) {
								frappe.show_alert({
									message: (r.message && r.message.error) || 'Could not refresh the row. Opening the on-screen copy.',
									indicator: 'orange'
								});
							}
							rows.forEach((fresh) => this.applyFreshEditRow(fresh));
							if (callback) callback(rows);
						},
						error: () => {
							frappe.show_alert({
								message: 'Could not refresh the row. Opening the on-screen copy.',
								indicator: 'orange'
							});
							if (callback) callback([]);
						}
					});
				},

				applyFreshEditRow(fresh) {
					if (!fresh || fresh.ID == null) return;
					const idx = (this.records || []).findIndex(r => String(r.ID) === String(fresh.ID));
					if (idx < 0) return;
					const prev = this.records[idx];
					this.records.splice(idx, 1, Object.assign({}, prev, fresh));
				},

				openEditClone(row) {
					if (!row || row.ID == null) return;
					if (this.editingRows[row.ID]) {
						this.expandedRows[row.ID] = true;
						this.activeTab[row.ID] = this.userMode === 'procurement' ? 'supplier' : 'counterpart';
						return;
					}
					let clone = { ...row };
					if (clone.RFQDATE) {
						clone.RFQDATE = String(clone.RFQDATE).split(' ')[0];
					}
					if (clone.DUE_DATE) {
						clone.DUE_DATE = String(clone.DUE_DATE).split(' ')[0];
					}
					this.editingRows[row.ID] = clone;
					this.editSnapshots[row.ID] = { ...clone };

					delete this.supplierData[row.ID];

					if (this.userMode === 'procurement') {
						this.fetchSupplierData([row.ID]);
						if (this.canViewCustomerOrders) {
							this.fetchCustomerOrderData([row.ID]);
						}
					} else if (this.userMode === 'sales') {
						this.fetchCustomerOrderData([row.ID]);
					}

					this.expandedRows[row.ID] = true;
					this.activeTab[row.ID] = this.userMode === 'procurement' ? 'supplier' : 'counterpart';
				},

				startEdit(row) {
					if (!row || row.ID == null) return;
					if (this.editingRows[row.ID]) {
						this.expandedRows[row.ID] = true;
						this.activeTab[row.ID] = this.userMode === 'procurement' ? 'supplier' : 'counterpart';
						return;
					}
					const id = String(row.ID);
					if (this.editFetchPending[id]) return;
					this.editFetchPending[id] = true;
					this.fetchRowsForEdit([row.ID], (rows) => {
						delete this.editFetchPending[id];
						if (this.editingRows[row.ID]) return;

				applySavedQuoteToLocalRow(payload) {
					if (!payload || payload.ID === undefined || payload.ID === null || payload.ID === '') {
						return;
					}

					const rec = (this.records || []).find(r => String(r.ID) === String(payload.ID));
					if (!rec) {
						return;
					}

					const skipKeys = {
						supplier_records: true,
						customer_order_records: true,
						is_new: true
					};

					Object.keys(payload).forEach((key) => {
						if (skipKeys[key]) {
							return;
						}
						rec[key] = payload[key];
					});

					// Same rule as update_quote_record / bulk_update_quote_records:
					// a numeric quotation sales price forces PROCUREMENT_STATUS to Q-QUOTED.
					const salesPriceRaw = String(rec.SALES_PRICE || '').trim().replace(/,/g, '');
					const looksNumeric = (
						salesPriceRaw !== '' &&
						!/[a-zA-Z]/.test(salesPriceRaw) &&
						!isNaN(parseFloat(salesPriceRaw))
					);
					if (looksNumeric) {
						rec.PROCUREMENT_STATUS = 'Q-QUOTED';
					}
				},


				
				_quoteSaveKeys() {
					if (this.userMode === 'sales') {
						return [

							'CUSTOMER_REF', 'DUE_DATE', 'DUE_TIME', 'SAP', 'RP', 'ST',
							'SALE_PRICE', 'REF', 'ITEM', 'QTY', 'UNIT', 'BRAND', 'PART_NUMBER',
							'DESCRIPTION', 'INCOTERM', 'NOTE', 'FEEDBACK', 'CUSTOMER_BID_NUMBER',
							'CUSTOM_SALES_STATUS', 'PROCUREMENT_STATUS'

					return [
						'REF', 'RFQDATE', 'REP', 'ITEM', 'QTY', 'UNIT', 'BRAND', 'PART_NUMBER',
						'DESCRIPTION', 'CO', 'APROX_WEIGHT', 'INCOTERM', 'SALES_PRICE',

						'PROCUREMENT_STATUS', 'TEST'

				},

				buildQuoteSavePayload(rowId) {
					const current = this.editingRows[rowId] || {};
					const snap = this.editSnapshots[rowId] || {};
					const payload = {
						ID: current.ID,
						MODIFIED: current.MODIFIED
					};
					this._quoteSaveKeys().forEach((key) => {
						if (this._normEditVal(current[key]) !== this._normEditVal(snap[key])) {
							payload[key] = current[key];
						}
					});
					if (this.userMode === 'procurement') {
						payload.supplier_records = this.supplierData[rowId] || [];
					}
					if (this.customerOrderData[rowId]) {
						payload.customer_order_records = this.customerOrderData[rowId];
					}
					return payload;
				},

				saveEdit(rowId) {
					let payload = this.buildQuoteSavePayload(rowId);
					
					let methodName = (this.userMode === 'sales') 
						? 'my_custom_app.procurement_panel.update_sales_rfq_record' 
						: 'my_custom_app.procurement_panel.update_quote_record';

					frappe.call({
						method: methodName,
						args: { payload: JSON.stringify(payload) },
						callback: (r) => {
							if (r.message && r.message.status === 'success') {
								frappe.show_alert({message: "Record updated successfully!", indicator: 'green'});
								if (this.userMode === 'procurement') {
									this.applySavedQuoteToLocalRow(payload);
									const rec = (this.records || []).find(r => String(r.ID) === String(payload.ID));
									if (rec && r.message && r.message.modified) {
										rec.MODIFIED = r.message.modified;
									}
									this.holdVisibleRecords = true;
									delete this.editingRows[rowId];
									delete this.editSnapshots[rowId];
									delete this.supplierData[rowId];
									delete this.customerOrderData[rowId];
									delete this.expandedRows[rowId];
									delete this.activeTab[rowId];
									// Do NOT reload the filtered query. The row stays on this page
									// with the values just saved so the user can correct it again.
									// Badge counts are updated; the table is not re-queried.
									this.fetchQuickFilterBadges();
								} else {
									delete this.editingRows[rowId];
									delete this.editSnapshots[rowId];
									delete this.supplierData[rowId];
									delete this.customerOrderData[rowId];
									delete this.expandedRows[rowId];
									delete this.activeTab[rowId];
									this.manualRefresh();
								}
							} else {
								frappe.msgprint({
									title: (r.message && r.message.stale) ? 'Row changed by someone else' : 'Database Error',
									indicator: 'red',
									message: (r.message && r.message.error) || "Failed to update record."
								});
							}
						}
					});
				},

						{ key: 'REP', label: 'Rep', text: false },
						{ key: 'ITEM', label: 'Item', text: false },

						{ key: 'UNIT', label: 'Unit', text: false },

				_normEditVal(val) {
					if (val === null || val === undefined) return '';
					return String(val);
				},

				_previewEditVal(val) {
					const s = this._normEditVal(val);
					if (!s) return '';
					return s.length > 80 ? (s.slice(0, 80) + '…') : s;
				},

				_detectTextMode(oldVal, newVal) {
					const oldS = this._normEditVal(oldVal);
					const newS = this._normEditVal(newVal);
					if (oldS && newS.endsWith(oldS) && newS.length > oldS.length) {
						return {
							mode: 'prefix',
							fragment: newS.slice(0, newS.length - oldS.length)
						};
					}
					if (oldS && newS.startsWith(oldS) && newS.length > oldS.length) {
						return {
							mode: 'suffix',
							fragment: newS.slice(oldS.length)
						};
					}
					return { mode: 'replace', fragment: '' };

				_ensureRowInEditMode(row) {
					if (!row || row.ID === undefined || row.ID === null || row.ID === '') return null;
					if (this.editingRows[row.ID]) {

					}
					let clone = { ...row };
					if (clone.RFQDATE) clone.RFQDATE = String(clone.RFQDATE).split(' ')[0];
					if (clone.DUE_DATE) clone.DUE_DATE = String(clone.DUE_DATE).split(' ')[0];

					this.editSnapshots[row.ID] = { ...clone };

				openMassApplyModalFromBar() {

						? selectedEditing[0]
						: (this.massApplySourceId && selectedEditing.includes(this.massApplySourceId)
							? this.massApplySourceId

				openMassApplyModal(sourceId) {
					if (this.userMode !== 'procurement') return;
					if (!sourceId || !this.editingRows[sourceId]) {
						frappe.msgprint({
							title: 'Source row is not in edit mode',

					}
					if (!this.selectedIds.includes(sourceId)) {
						frappe.msgprint({
							title: 'Source row is not selected',
							indicator: 'orange',
							message: 'Select the source row and the rows that should receive its changes.'
						});
						return;
					}
					const targets = this.selectedIds.filter(id => String(id) !== String(sourceId));
					if (targets.length === 0) {
						frappe.msgprint({
							title: 'Select more rows',
							indicator: 'orange',
							message: 'Select at least one other row to apply the changes to.'
						});
						return;
					}

					const current = this.editingRows[sourceId] || {};
					const original = this.editSnapshots[sourceId] || {};
					const fields = [];

					this._massApplyFieldCatalog().forEach((meta) => {
						const oldVal = original[meta.key];
						const newVal = current[meta.key];
						if (this._normEditVal(oldVal) === this._normEditVal(newVal)) return;

						const detected = meta.text ? this._detectTextMode(oldVal, newVal) : { mode: 'replace', fragment: '' };
						fields.push({
							key: meta.key,
							label: meta.label,
							allowTextMode: !!meta.text,
							checked: true,
							mode: detected.mode,
							fragment: detected.fragment || '',
							oldVal: oldVal,
							newVal: newVal,
							oldPreview: this._previewEditVal(oldVal),
							newPreview: this._previewEditVal(newVal)
						});
					});

				applyMassChanges() {

					const sourceRow = sourceId ? this.editingRows[sourceId] : null;
					if (!sourceRow) return;

					const chosen = (this.massApplyFields || []).filter(f => f.checked);
					if (chosen.length === 0) {
						frappe.msgprint({
							title: 'No fields selected',
							indicator: 'orange',
							message: 'Check at least one changed field to apply.'
						});
						return;
					}

					const targetIds = (this.selectedIds || []).filter(id => String(id) !== String(sourceId));
					let appliedRows = 0;

					targetIds.forEach((id) => {
						let row = (this.records || []).find(r => String(r.ID) === String(id));
						if (!row && this.editingRows[id]) {
							row = this.editingRows[id];
						}
						if (!row) return;

						const target = this._ensureRowInEditMode(row);
						if (!target) return;

						chosen.forEach((f) => {
							if (f.mode === 'prefix') {
								const fragment = f.fragment || '';
								if (!fragment) return;
								const currentVal = this._normEditVal(target[f.key]);
								if (!currentVal.startsWith(fragment)) {
									target[f.key] = fragment + currentVal;
								}
							} else if (f.mode === 'suffix') {
								const fragment = f.fragment || '';
								if (!fragment) return;
								const currentVal = this._normEditVal(target[f.key]);
								if (!currentVal.endsWith(fragment)) {
									target[f.key] = currentVal + fragment;
								}
							} else {
								target[f.key] = f.newVal;
							}
						});

						appliedRows += 1;
					});

					this.showMassApplyModal = false;
					frappe.show_alert({
						message: `Applied ${chosen.length} field(s) to ${appliedRows} selected row(s). Review, then Mass Save Edits.`,
						indicator: 'green'
					});
				},

				getCloneStatusLetter(statusValue) {
					const raw = String(statusValue || '').trim();
					if (!raw) return '';
					const beforeHyphen = raw.split('-')[0].trim();
					const letterMatch = beforeHyphen.match(/[A-Za-z]/);
					return letterMatch ? letterMatch[0].toUpperCase() : '';
				},

				getCloneRp3(rpValue) {
					const digits = String(rpValue || '').replace(/\D/g, '');
					if (!digits) return '';
					if (digits.length >= 3) return digits.slice(-3);
					return digits.padStart(3, '0');
				},

				stripCloneStatusSuffix(refValue) {
					return String(refValue || '').replace(/-[A-Za-z]\d{3}$/, '');
				},

				buildCloneRef(row) {
					let base = this.stripCloneStatusSuffix(row._baseRef || '');
					if (row.Z_CHECK && base.toUpperCase().charAt(0) !== 'Z') {
						base = 'Z' + base;
					}
					const letter = this.getCloneStatusLetter(row.CUSTOM_SALES_STATUS);
					const rp3 = this.getCloneRp3(row.RP);
					if (letter && rp3) {
						return base + '-' + letter + rp3;
					}
					if (letter && !rp3) {
						return base + '-' + letter;
					}
					return base;
				},

				refreshCloneRef(row) {
					if (!row) return;
					const nextRef = this.buildCloneRef(row);
					const current = String(row.REF || '');
					const lastAuto = String(row._lastAutoRef || '');
					// Manual edit wins until REF still equals the last auto value
					if (current && current !== lastAuto) {
						return;
					}
					row.REF = nextRef;
					row._lastAutoRef = nextRef;
				},

				onCloneRefManualEdit(row) {
					if (!row) return;
					// User typed in REF after (or instead of) the auto suffix.
					// refreshCloneRef will skip overwrites while REF !== _lastAutoRef.
				},

				onCloneGlobalSalesStatusChange() {

				applyCloneReason() {
					if (!this.cloneReason || !this.cloneReason.trim()) {

				},
				
				
				

				submitClone() {
					// Every item must have its own reason filled
					const missingReason = this.cloneRecords.filter(r => !r.reason || !r.reason.trim());
					if (missingReason.length > 0) {
						frappe.msgprint({
							title: 'Missing Reason',
							indicator: 'red',
							message: 'Every item must have a Reason. Use the global field + Apply, or type a reason directly on each row.'
						});
						return;
					}

					// Validate every row has a due date
					const missingDue = this.cloneRecords.filter(r => !r.DUE_DATE);
					if (missingDue.length > 0) {
						frappe.msgprint({ title: 'Missing Due Date', indicator: 'red', message: 'Every cloned row must have a Due Date filled in.' });
						return;
					}

					// Banned-date check (identical logic to upload Step 2)
					let bannedHit = null;
					for (const row of this.cloneRecords) {
						const isBanned = this.bannedDates.some(b => b.date === row.DUE_DATE);
						if (isBanned) {
							bannedHit = row.DUE_DATE;
							break;
						}
					}
					if (bannedHit) {
						frappe.msgprint({
							title: 'Banned Date Error',
							indicator: 'red',
							message: `Cannot create clones. The Due Date ${bannedHit} is currently banned. Please choose another date.`
						});
						return;
					}

					// ===== ADDED: define the missing variable (same pattern as missingReason / missingDue) =====
					const missingLink = this.cloneRecords.filter(r => !r.LINKED_CUSTOMER_ID || !r.LINKED_CONTACT_ID);
					if (missingLink.length > 0) {
						frappe.msgprint({
							title: 'Unverified Customer / Contact',
							indicator: 'red',
							message: 'Every cloned row must have a verified (green) Customer and Contact. Please select them from the dropdowns.'
						});
						return;
					}
					// ========================================================================================

					this.isCloning = true;

					// Prepare payload: strip client-only helpers and keep only what the backend needs
					const payload = this.cloneRecords.map(r => ({
						REF: r.REF,
						Z_CHECK: !!r.Z_CHECK,
						DUE_DATE: r.DUE_DATE,
						DUE_TIME: r.DUE_TIME || '',
						QTY: r.QTY,
						UNIT: r.UNIT,
						PART_NUMBER: r.PART_NUMBER,
						BRAND: r.BRAND,
						SAP: r.SAP,
						ITEM: r.ITEM,
						CO: r.CO,
						APROX_WEIGHT: r.APROX_WEIGHT,
						INCOTERM: r.INCOTERM,
						DELIVERY: r.DELIVERY,
						NOTE: r.NOTE,
						DESCRIPTION: r.DESCRIPTION || '',
						QUOTE_DESCRIPTION: r.DESCRIPTION || '',
						ORIG_ITEM: r.ORIG_ITEM,
						ORIG_QTY: r.QTY,
						ORIG_UNIT: r.ORIG_UNIT,
						ORIG_BRAND: r.ORIG_BRAND,
						ORIG_PART_NUMBER: r.ORIG_PART_NUMBER,
						ORIG_DESCRIPTION: r.DESCRIPTION || '',
						ORIG_NOTE: r.ORIG_NOTE,
						CUSTOMER: r.CUSTOMER,
						DIV: r.DIV,
						CONTACT: r.CONTACT,
						EMAIL_CUSTOMER: r.EMAIL_CUSTOMER,
						CUSTOMER_REF: r.CUSTOMER_REF,
						DATE: r.DATE,
						COUNTRY: r.COUNTRY,
						ST: r.ST,
						REP: r.RP || r.REP || '',
						RP: r.RP || r.REP || '',
						SALE_PRICE: r.SALE_PRICE || '',
						reason: (r.reason || '').trim(),
						CUSTOM_SALES_STATUS: r.CUSTOM_SALES_STATUS || '',
						attachment_filename: r._attachmentName || '',
						attachment_base64: r._attachmentBase64 || ''
					}));

					frappe.call({
						method: 'my_custom_app.procurement_panel.clone_request_and_quote_records',
						args: {
							records_json: JSON.stringify(payload)
						},
						callback: (r) => {
							this.isCloning = false;
							if (r.message && r.message.status === 'success') {
								frappe.show_alert({
									message: `Successfully created ${r.message.created} cloned record(s).`,
									indicator: 'green'
								});
								this.showCloneModal = false;
								this.cloneRecords = [];
								this.cloneReason = '';
								this.selectedIds = [];
								this.fetchData();
							} else {
								frappe.msgprint({
									title: 'Clone Failed',
									indicator: 'red',
									message: (r.message && r.message.error) ? r.message.error : 'Unknown error while creating clones.'
								});
							}
						},
						error: (err) => {
							this.isCloning = false;
							console.error('Clone network error:', err);
							frappe.msgprint({ title: 'Network Error', indicator: 'red', message: 'Could not reach the server. Check the console.' });
						}
					});
				},
