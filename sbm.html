<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Supplier-Brand Management</title>
    <script src="https://unpkg.com/vue@3/dist/vue.global.prod.js"></script>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/5.15.4/css/all.min.css">
    <style>
        html, body { height: 100%; margin: 0; padding: 0; overflow: hidden; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Arial, sans-serif; background-color: #f4f5f7; }
        .app-container { display: flex; flex-direction: column; height: 100vh; max-height: 100vh; }
        .cursor-pointer { cursor: pointer; user-select: none; }
        .cursor-pointer:hover { background-color: #e2e6ea; }

        .modal-overlay { position: fixed; top: 0; left: 0; width: 100vw; height: 100vh; background: rgba(0,0,0,0.6); z-index: 1050; display: flex; justify-content: center; align-items: center; }
        .rfq-modal-content { background: white; padding: 25px; border-radius: 8px; width: 1600px; max-width: 98%; max-height: 95vh; overflow-y: auto; box-shadow: 0 10px 25px rgba(0,0,0,0.2); }

        .ac-list { position: absolute; top: 100%; left: 0; width: 100%; background: white; border: 1px solid #ced4da; border-radius: 4px; z-index: 1100; max-height: 250px; overflow-y: auto; box-shadow: 0 4px 6px rgba(0,0,0,0.1); }
        .ac-item { padding: 6px 12px; font-size: 12px; cursor: pointer; border-bottom: 1px solid #f1f3f5; }
        .ac-item:hover { background-color: #e9ecef; }

        footer, .page-footer, .web-footer, .navbar, .web-footer, header.web-header { display: none !important; }

        .btn-xs { padding: 0.125rem 0.35rem; font-size: 0.75rem; line-height: 1.4; border-radius: 0.2rem; }

        .sbm-page-shell {
            position: fixed;
            inset: 0;
            background: #f4f5f7;
            z-index: 10;
            display: flex;
            justify-content: center;
            align-items: stretch;
            padding: 10px;
        }
        .sbm-page-card {
            background: white;
            padding: 16px 18px 12px;
            border-radius: 8px;
            width: 100%;
            height: 100%;
            display: flex;
            flex-direction: column;
            overflow: hidden;
            box-shadow: 0 4px 16px rgba(0,0,0,0.08);
        }

        .modal-backdrop { z-index: 1070 !important; }
        .modal { z-index: 1080 !important; }

        .login-screen {
            position: fixed;
            inset: 0;
            background: linear-gradient(135deg, #f8fafc 0%, #e2e8f0 100%);
            display: flex;
            align-items: center;
            justify-content: center;
            z-index: 9999;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Arial, sans-serif;
        }
        .login-card {
            background: #ffffff;
            border-radius: 12px;
            box-shadow: 0 10px 40px rgba(0,0,0,0.12);
            width: 100%;
            max-width: 420px;
            padding: 40px 36px 32px;
            text-align: center;
        }
        .login-logo {
            max-height: 64px;
            margin-bottom: 18px;
            display: block;
            margin-left: auto;
            margin-right: auto;
        }
        .login-title {
            font-size: 22px;
            font-weight: 700;
            color: #1e293b;
            margin-bottom: 6px;
        }
        .login-subtitle {
            font-size: 13px;
            color: #64748b;
            margin-bottom: 28px;
        }
        .login-form .form-control {
            height: 46px;
            font-size: 15px;
            border-radius: 8px;
            border: 1px solid #cbd5e1;
        }
        .login-form .form-control:focus {
            border-color: #0d6efd;
            box-shadow: 0 0 0 3px rgba(13,110,253,0.15);
        }
        .login-btn {
            height: 46px;
            font-size: 15px;
            font-weight: 600;
            border-radius: 8px;
            width: 100%;
            margin-top: 8px;
        }
        .login-error {
            background: #fef2f2;
            color: #b91c1c;
            border: 1px solid #fecaca;
            border-radius: 6px;
            padding: 10px 14px;
            font-size: 13px;
            margin-bottom: 16px;
            text-align: left;
        }
        .denied-screen {
            position: fixed;
            inset: 0;
            display: flex;
            align-items: center;
            justify-content: center;
            background: #f4f5f7;
            z-index: 20;
        }

        .sbm-drag-source {
            cursor: grab;
        }
        .sbm-drag-source:active {
            cursor: grabbing;
        }
        .sbm-drag-source.sbm-dragging {
            opacity: 0.45;
        }
        .sbm-drop-target {
            transition: box-shadow 0.12s ease, outline-color 0.12s ease, background-color 0.12s ease;
        }
        .sbm-drop-target.sbm-drop-ready {
            outline: 2px dashed #0d6efd;
            outline-offset: 2px;
            box-shadow: 0 0 0 4px rgba(13, 110, 253, 0.12);
            background-color: #eef5ff !important;
        }
        .sbm-drop-target.sbm-drop-ready-danger {
            outline: 2px dashed #dc3545;
            outline-offset: 2px;
            box-shadow: 0 0 0 4px rgba(220, 53, 69, 0.12);
            background-color: #fff5f5 !important;
        }
        .sbm-drag-hint {
            font-size: 10px;
            letter-spacing: 0.2px;
        }

        .sbm-p-badge {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            min-width: 18px;
            height: 18px;
            padding: 0 5px;
            border-radius: 999px;
            background: #f6c343;
            color: #5c4300;
            font-size: 10px;
            font-weight: 800;
            line-height: 1;
            letter-spacing: 0.3px;
        }
        .sbm-cc-badge {
            display: inline-flex;
            align-items: center;
            background: #0d6efd;
            color: #fff;
            font-size: 9px;
            font-weight: 700;
            letter-spacing: 0.4px;
            padding: 2px 6px;
            border-radius: 999px;
        }
        .sbm-entity-row {
            background: #fff;
            border: 1px solid #e6eaf0;
            border-radius: 8px;
            padding: 10px 12px;
            margin-bottom: 8px;
        }
        .sbm-entity-row:last-child { margin-bottom: 0; }
        .sbm-entity-row.is-primary {
            border-color: #f6c343;
            box-shadow: 0 0 0 2px rgba(246, 195, 67, 0.18);
        }
        .sbm-entity-row.is-cc {
            border-color: #b6d4fe;
        }
        .sbm-cc-btn.is-faded {
            opacity: 0.35;
            pointer-events: none;
        }
        .sbm-link-card {
            background: #fff;
            border: 1px solid #d7deea;
            border-radius: 10px;
            box-shadow: 0 2px 8px rgba(16, 24, 40, 0.06);
            margin-bottom: 12px;
            overflow: visible;
        }
        .sbm-link-card + .sbm-link-card { margin-top: 0; }
        .sbm-link-header {
            background: #fff;
            cursor: pointer;
            user-select: none;
        }
        .sbm-link-header:hover { background: #f8fafc; }
        .sbm-type-badge {
            font-size: 10px;
            font-weight: 700;
            letter-spacing: 0.3px;
            background: #eef2f7;
            color: #334155;
            border-radius: 999px;
            padding: 3px 8px;
        }
        .sbm-activity-item {
            border-left: 3px solid #cbd5e1;
            padding: 8px 10px 8px 12px;
            margin-bottom: 8px;
            background: #fff;
            border-radius: 0 8px 8px 0;
        }
		
		.searchable-wrap { position: relative; }
        .searchable-dropdown {
            position: absolute; left: 0; right: 0; top: 100%; z-index: 20;
            background: #fff; border: 1px solid #ced4da; border-radius: 4px;
            max-height: 220px; overflow-y: auto; box-shadow: 0 6px 16px rgba(0,0,0,0.12);
        }
        .searchable-dropdown .item {
            padding: 7px 12px; cursor: pointer; font-size: 13px;
        }
        .searchable-dropdown .item:hover { background: #e9ecef; }
        .sbm-aa-cert-one { background: #198754; }
        .sbm-aa-cert-combo { background: #0dcaf0; color: #055160; }
        .sbm-aa-cert-brand { background: #ffc107; color: #664d03; }
        .sbm-aa-cert-bad { background: #dc3545; }
		.sbm-aa-cert-one { background: #198754; }
        .sbm-aa-cert-combo { background: #0dcaf0; color: #055160; }
        .sbm-aa-cert-brand { background: #ffc107; color: #664d03; }
        .sbm-aa-cert-bad { background: #dc3545; }

        .sbm-aa-th-sortable { cursor: pointer; user-select: none; white-space: nowrap; }
        .sbm-aa-th-sortable:hover { background: #eef1f4; }
        .sbm-aa-sort-icon { font-size: 10px; margin-left: 3px; opacity: 0.35; }
        .sbm-aa-sort-icon.active { opacity: 1; }

        .sbm-aa-rep-chip-wrap {
            display: flex;
            flex-wrap: wrap;
            gap: 6px;
            align-items: center;
        }
        .sbm-aa-rep-chip {
            display: inline-flex;
            align-items: center;
            gap: 6px;
            border: 1px solid #ced4da;
            background: #fff;
            color: #334155;
            border-radius: 999px;
            padding: 3px 10px;
            font-size: 12px;
            line-height: 1.2;
            cursor: pointer;
        }
        .sbm-aa-rep-chip:hover { background: #eef5ff; border-color: #0d6efd; }
        .sbm-aa-rep-chip.is-active {
            background: #0d6efd;
            border-color: #0d6efd;
            color: #fff;
        }
        .sbm-aa-rep-count {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            min-width: 18px;
            height: 18px;
            padding: 0 5px;
            border-radius: 999px;
            background: #e9ecef;
            color: #495057;
            font-size: 10px;
            font-weight: 800;
        }
        .sbm-aa-rep-chip.is-active .sbm-aa-rep-count {
            background: rgba(255,255,255,0.22);
            color: #fff;
        }
		
    </style>
</head>
<body>
{% raw %}
<div id="app" class="app-container">

    <!-- ==================== LOGIN SCREEN ==================== -->
    <div v-if="!isLoggedIn" class="login-screen">
        <div class="login-card">
            <img src="/assets/my_custom_app/images/gl_logo.png"
                 alt="GL General Industries Corp"
                 class="login-logo"
                 onerror="this.style.display='none'">
            <div class="login-title">GL General Industries Corp </div>
            <div class="login-subtitle">Sign in to Supplier-Brand Management</div>

            <div v-if="loginError" class="login-error">
                <i class="fas fa-exclamation-circle me-1"></i>{{ loginError }}
            </div>

            <form class="login-form" @submit.prevent="doLogin">
                <div class="mb-3 text-start">
                    <label class="form-label small fw-bold text-muted mb-1">Username / Email</label>
                    <input type="text"
                           class="form-control"
                           v-model="loginUsername"
                           autocomplete="username"
                           required
                           autofocus
                           placeholder="e.g. 114@glgeneralindustries.com">
                </div>
                <div class="mb-3 text-start">
                    <label class="form-label small fw-bold text-muted mb-1">Password</label>
                    <input type="password"
                           class="form-control"
                           v-model="loginPassword"
                           autocomplete="current-password"
                           required
                           placeholder="••••••••">
                </div>
                <button type="submit"
                        class="btn btn-primary login-btn"
                        :disabled="isLoggingIn">
                    <i v-if="isLoggingIn" class="fas fa-circle-notch fa-spin me-2"></i>
                    {{ isLoggingIn ? 'Signing in…' : 'Sign In' }}
                </button>
            </form>
        </div>
    </div>

    <!-- ==================== ACCESS DENIED ==================== -->
    <div v-else-if="rolesReady && !canAccessSbm" class="denied-screen">
        <div class="login-card">
            <div class="login-title text-danger">Access Denied</div>
            <div class="login-subtitle">Supplier-Brand Management is limited to Procurement T2 / T3 and Administrator.</div>
        </div>
    </div>

    <!-- ==================== MAIN SBM APPLICATION ==================== -->
    <template v-else>
	<div v-if="canAccessSbm" class="sbm-page-shell">
        <div class="sbm-page-card">
            <div class="d-flex justify-content-between align-items-center mb-2 border-bottom pb-2" style="flex: 0 0 auto;">
                <h5 class="m-0 text-danger fw-bold"><i class="fas fa-cogs"></i> Supplier-Brand Management System</h5>
                <button type="button" class="btn-close" @click="closeSbmPage()" title="Close"></button>
            </div>
            
            <ul class="nav nav-tabs mb-3" style="flex: 0 0 auto; min-height: 42px; flex-wrap: nowrap;">
                <li class="nav-item cursor-pointer" @click="setActiveSbmTab('supplier')">
                    <a class="nav-link fw-bold"
                       :class="activeSbmTab === 'supplier' ? 'active text-primary' : 'text-muted'">
                        Supplier View
                    </a>
                </li>
                <li class="nav-item cursor-pointer" @click="setActiveSbmTab('brand')">
                    <a class="nav-link fw-bold"
                       :class="activeSbmTab === 'brand' ? 'active text-danger' : 'text-muted'">
                        Brand View
                    </a>
                </li>
                <li class="nav-item cursor-pointer" @click="setActiveSbmTab('autoassign')">
                    <a class="nav-link fw-bold"
                       :class="activeSbmTab === 'autoassign' ? 'active text-info' : 'text-muted'">
                        Auto Assign
                    </a>
                </li>
             </ul>

            <div v-if="activeSbmTab === 'supplier'" class="d-flex overflow-hidden gap-3" style="flex: 1 1 0; min-height: 0;">
                <div v-show="sbmSidebarOpen" class="d-flex flex-column border rounded bg-light p-2 h-100 transition-all" style="width: 25%; min-width: 250px;">
                    <div class="d-flex flex-column gap-2 mb-2">
                        <button class="btn btn-sm btn-success fw-bold shadow-sm w-100" @click="openSupplierModal('new')">
                            <i class="fas fa-plus me-1"></i> Add New Supplier
                        </button>
                        <div class="input-group input-group-sm w-100 shadow-sm">
                            <span class="input-group-text bg-white text-muted border-end-0"><i class="fas fa-search"></i></span>
                            <input type="text" class="form-control border-start-0 ps-0" v-model="sbmSearch" @input="filterSbmSuppliers" placeholder="Search suppliers...">
                        </div>
                    </div>
                    <div class="flex-grow-1 overflow-auto border-top pt-2" @scroll="handleSbmScroll">
						<div v-for="sup in filteredSbmSuppliers" :key="sup.name" 
							 class="p-2 border-bottom cursor-pointer hover-bg-white"
							 :class="{'bg-primary text-white': sbmActiveSupplier === sup.name}"
							 @click="selectSbmSupplier(sup.name)">
							<div class="fw-bold" style="font-size: 12px;">{{ sup.supplier_name || sup.name }}</div>
						</div>
					 </div>
                </div>

                <div class="d-flex flex-column h-100 overflow-auto pe-2 transition-all" :style="{ width: sbmSidebarOpen ? '75%' : '100%' }">
                    <div class="d-flex justify-content-start mb-2">
                        <button class="btn btn-sm btn-outline-secondary border-0 bg-light text-muted shadow-sm" @click="sbmSidebarOpen = !sbmSidebarOpen" title="Toggle Supplier List">
                            <i class="fas" :class="sbmSidebarOpen ? 'fa-chevron-left' : 'fa-chevron-right'"></i> {{ sbmSidebarOpen ? 'Collapse List' : 'Expand List' }}
                        </button>
                    </div>
                    <div v-if="sbmLoadingDetails" class="text-center p-5"><i class="fas fa-spinner fa-spin fa-2x"></i></div>
                    
                    <div v-else-if="sbmSupplierDetails.name" class="d-flex flex-column gap-3 pb-2" style="flex: 1 1 0; min-height: 0; overflow: hidden;">

                        <div class="d-flex justify-content-between align-items-center">
                            <h5 class="m-0 fw-bold text-dark">
                                <i class="fas fa-building text-primary me-2"></i>Supplier Profile
                            </h5>
                            <div class="d-flex gap-2">
                                <button v-if="canDeleteSbmSupplier"
                                        class="btn btn-sm btn-outline-danger fw-bold shadow-sm"
                                        @click="deleteSbmSupplier"
                                        :disabled="!sbmActiveSupplier">
                                    <i class="fas fa-trash me-1"></i> Delete Supplier
                                </button>
                                <button class="btn btn-sm btn-primary fw-bold shadow-sm" @click="saveSbmGeneralDetails">
                                    <i class="fas fa-save me-1"></i> Save Profile
                                </button>
                            </div>
                        </div>

                        <div class="row g-3 align-items-stretch" style="flex: 1 1 0; min-height: 0; overflow: hidden;">

                            <!-- ==================== COLUMN A ==================== -->
                            <div class="col-lg-5 h-100 overflow-auto">
                                <div class="d-flex flex-column gap-3">

                                    <div class="card shadow-sm border-0 border-top border-primary border-3">
                                        <div class="card-body p-3">
                                            <div class="d-flex flex-wrap align-items-center gap-2 mb-2">
                                                <span class="small fw-bold text-muted text-uppercase me-1" style="letter-spacing:0.5px;"><i class="fas fa-tags me-1"></i>Tags:</span>
                                                <span v-for="t in (sbmSupplierDetails.tags || [])" :key="t"
                                                      class="badge bg-primary d-inline-flex align-items-center gap-1 py-1 px-2" style="font-size:12px;">
                                                    {{ t }}
                                                    <button class="btn-close btn-close-white" style="font-size:8px;"
                                                            @click="confirmRemoveTag(t)" title="Remove tag"></button>
                                                </span>
                                                <div class="position-relative">
                                                    <button class="btn btn-xs btn-outline-primary py-0 px-2" @click="toggleTagPicker">
                                                        <i class="fas fa-plus"></i> Add Tag
                                                    </button>
                                                    <div v-if="showTagPicker" class="ac-list shadow-lg border-primary" style="min-width:220px; top:100%; left:0; z-index:1100;">
                                                        <input type="text" class="form-control form-control-sm border-0 border-bottom rounded-0"
                                                               v-model="tagSearch" placeholder="Filter tags…" autofocus>
                                                        <div v-for="tag in filteredAvailableTags" :key="tag"
                                                             class="ac-item" @mousedown.prevent="addTagToCurrentSupplier(tag)">
                                                            {{ tag }}
                                                        </div>
                                                        <div v-if="filteredAvailableTags.length === 0" class="ac-item text-muted small">No matching tags</div>
                                                    </div>
                                                </div>
                                            </div>
                                            <label class="form-label small fw-bold text-muted mb-1 text-uppercase" style="letter-spacing: 0.5px;">Supplier Name</label>
                                            <input type="text" class="form-control form-control-lg fw-bold border-primary shadow-sm" style="font-size: 16px;" v-model="sbmSupplierDetails.supplier_name">
                                        </div>
                                    </div>

                                    <div class="card shadow-sm border-0">
                                        <div class="card-header bg-white border-bottom d-flex justify-content-between align-items-center py-2">
                                            <span class="small fw-bold text-muted text-uppercase">
                                                <i class="fas fa-map-marker-alt text-danger me-1"></i> Addresses
                                            </span>
                                            <button class="btn btn-xs btn-outline-success fw-bold" @click="openNewSbmAddressModal" title="Create New Address">
                                                <i class="fas fa-plus"></i> Add Address
                                            </button>
                                        </div>
                                        <div class="card-body p-2 bg-light">
                                            <div v-if="!(sbmSupplierDetails.available_addresses && sbmSupplierDetails.available_addresses.length)"
                                                 class="text-center text-muted fst-italic py-3">
                                                No addresses linked yet.
                                            </div>
                                            <div v-for="addr in (sbmSupplierDetails.available_addresses || [])" :key="addr.name"
                                                 class="sbm-entity-row cursor-pointer"
                                                 :class="{'is-primary': isPrimaryAddress(addr)}"
                                                 @click="openEditSbmAddressModal(addr)">
                                                <div class="d-flex justify-content-between align-items-start gap-2">
                                                    <div class="flex-grow-1">
                                                        <div class="d-flex align-items-center gap-2 flex-wrap">
                                                            <span class="fw-bold text-dark">{{ addr.address_title || 'Unnamed Address' }}</span>
                                                            <span v-if="isPrimaryAddress(addr)" class="sbm-p-badge" title="Primary Address">P</span>
                                                            <span v-if="addr.address_type" class="badge bg-secondary" style="font-size: 10px;">{{ addr.address_type }}</span>
                                                        </div>
                                                        <div v-if="addr.address_line1" class="small text-dark mt-1">{{ addr.address_line1 }}</div>
                                                        <div v-if="addr.city || addr.country || addr.pincode" class="small text-muted">
                                                            {{ addr.city }}<span v-if="addr.city && (addr.country || addr.pincode)">,</span>
                                                            {{ addr.country }} {{ addr.pincode }}
                                                        </div>
                                                    </div>
                                                    <div class="d-flex flex-wrap gap-1" @click.stop>
                                                        <button class="btn btn-xs btn-outline-warning fw-bold"
                                                                :disabled="isPrimaryAddress(addr)"
                                                                @click="setPrimarySbmAddress(addr)"
                                                                title="Make this the Primary Address">
                                                            Make Primary
                                                        </button>
                                                        <button class="btn btn-xs btn-outline-secondary" @click="openEditSbmAddressModal(addr)" title="Edit this Address">
                                                            <i class="fas fa-edit"></i>
                                                        </button>
                                                        <button v-if="canDeleteSbmAddress"
                                                                class="btn btn-xs btn-outline-danger"
                                                                @click="deleteSbmAddress(addr)"
                                                                title="Delete this Address">
                                                            <i class="fas fa-trash"></i>
                                                        </button>
                                                    </div>
                                                </div>
                                            </div>
                                        </div>
                                    </div>

                                    <div class="card shadow-sm border-0">
                                        <div class="card-header bg-white border-bottom d-flex justify-content-between align-items-center py-2">
                                            <span class="small fw-bold text-muted text-uppercase">
                                                <i class="fas fa-user text-primary me-1"></i> Contacts
                                            </span>
                                            <button class="btn btn-xs btn-outline-success fw-bold" @click="openNewSbmContactModal" title="Create New Contact">
                                                <i class="fas fa-plus"></i> Add Contact
                                            </button>
                                        </div>
                                        <div class="card-body p-2 bg-light">
                                            <div v-if="!(sbmSupplierDetails.available_contacts && sbmSupplierDetails.available_contacts.length)"
                                                 class="text-center text-muted fst-italic py-3">
                                                No contacts linked yet.
                                            </div>
                                            <div v-for="cnt in (sbmSupplierDetails.available_contacts || [])" :key="cnt.name"
                                                 class="sbm-entity-row cursor-pointer"
                                                 :class="{'is-primary': isPrimaryContact(cnt), 'is-cc': isContactInCc(cnt) && !isPrimaryContact(cnt)}"
                                                 @click="openEditSbmContactModal(cnt)">
                                                <div class="d-flex justify-content-between align-items-start gap-2">
                                                    <div class="flex-grow-1">
                                                        <div class="d-flex align-items-center gap-2 flex-wrap">
                                                            <span class="fw-bold text-dark">{{ cnt.first_name }} {{ cnt.last_name || '' }}</span>
                                                            <span v-if="isPrimaryContact(cnt)" class="sbm-p-badge" title="Primary Contact">P</span>
                                                            <span v-if="isContactInCc(cnt)" class="sbm-cc-badge" title="Included in Default CC Matrix">CC</span>
                                                        </div>

        computed: {
			displayedBrands() {
				let brands = this.allBrands || [];
				let q = (this.newBrandInput || '').toLowerCase().trim();
				if (!q) return brands;
				return brands.filter(b => typeof b === 'string' && b.toLowerCase().includes(q));
			},
			filteredFormBrands() {
                let q = this.activeSupForm.brandSearch.toLowerCase().trim();
                if(!q) return [];
                return this.allBrands.filter(b => b.toLowerCase().includes(q) && !this.activeSupForm.brands.includes(b)).slice(0, 10);
            },
			exactBrandMatch() {
                let q = this.activeSupForm.brandSearch.toLowerCase().trim();
                if (!q) return false;
                return this.allBrands.some(b => b.toLowerCase() === q);
            },
            supplierEditOptions() {
                let q = this.supEditSearch.toLowerCase().trim();
                if(!q) return [];
                return this.masterSupplierList.filter(s => {
                    let matchName = s.name.toLowerCase().includes(q);
                    let matchEmail = s.email && s.email.toLowerCase().includes(q);
                    let matchBrand = s.brands && s.brands.some(b => {
                        let cleanB = b.toLowerCase().trim();
                        
                        // 1. Forward match: typing "Siemens" finds "Siemens - PLC"
                        if (cleanB.includes(q)) return true;
                        
                        // 2. Smart Reverse match: typing "Siemens - PLC" finds "Siemens", 
                        // but typing "Lagermeister" safely ignores "GE"
                        let escapedB = cleanB.replace(/[.*+?^${}()|[\]\\]/g, '\\$&');
                        let regex = new RegExp('\\b' + escapedB + '\\b', 'i');
                        return regex.test(q);
                    });
                    return matchName || matchEmail || matchBrand;
                }).slice(0, 10);
            },
			filteredAvailableTags() {
                const q = (this.tagSearch || '').toLowerCase().trim();
                const already = this.sbmSupplierDetails.tags || [];
                return (this.availableSupplierTags || [])
                    .filter(t => !already.includes(t) && (!q || t.toLowerCase().includes(q)));
            },
			
			
			
			parsedDefaultCc() {
                return (this.sbmSupplierDetails.custom_default_cc || '')
                    .split(',')
                    .map((s) => (s || '').trim())
                    .filter(Boolean);
            },

            sbmBrandRepAssignedRowCount() {
                return (this.brandRepList || []).filter((row) => row && row.source === 'bdu' && (row.user || '').trim()).length;
            },

            sbmBrandRepRepCounts() {
                const map = {};
                (this.brandRepList || []).forEach((row) => {
                    if (!row || row.source !== 'bdu') return;
                    const user = (row.user || '').trim();
                    if (!user) return;
                    if (!map[user]) {
                        map[user] = { user: user, user_label: user, count: 0 };
                    }
                    map[user].count += 1;
                });
                return Object.values(map).sort((a, b) => {
                    if (b.count !== a.count) return b.count - a.count;
                    return String(a.user).localeCompare(String(b.user));
                });
            },

            filteredSbmBrandRepList() {
                const q = (this.sbmBrandRepSearch || '').toLowerCase().trim();
                const quick = this.brandRepQuickFilter || '';
                const rep = (this.brandRepRepFilter || '').trim();
                let rows = (this.brandRepList || []).slice();

                if (quick === 'unassigned') {
                    rows = rows.filter((row) => row.source === 'glgnet');
                } else if (quick === 'no_conditions') {
                    rows = rows.filter((row) => (row.match_count || 0) === 0);
                }

                if (rep) {
                    rows = rows.filter((row) => row.source === 'bdu' && String(row.user || '').trim() === rep);
                }

                if (q) {
                    rows = rows.filter((row) => {
                        const hay = [
                            row.brand,
                            row.division_label,
                            row.division,
                            row.user,
                            row.role,
                            row.status,
                            row.notes
                        ].map((v) => String(v || '').toLowerCase()).join(' ');
                        return hay.indexOf(q) !== -1;
                    });
                }

                const field = this.sbmBrandRepSortField || 'brand';
                const dir = this.sbmBrandRepSortOrder === 'desc' ? -1 : 1;
                const valueOf = (row) => {
                    if (field === 'division') return String(row.division_label || row.division || '').toUpperCase();
                    if (field === 'priority') {
                        if (row.source !== 'bdu') return dir === 1 ? Number.POSITIVE_INFINITY : Number.NEGATIVE_INFINITY;
                        return Number(row.priority || 0);
                    }
                    if (field === 'match_count') return Number(row.match_count || 0);
                    return String(row[field] || '').toUpperCase();
                };

                rows.sort((a, b) => {
                    const va = valueOf(a);
                    const vb = valueOf(b);
                    if (va === '' && vb !== '') return 1;
                    if (vb === '' && va !== '') return -1;
                    if (va < vb) return -1 * dir;
                    if (va > vb) return 1 * dir;
                    return String(a.name || '').localeCompare(String(b.name || '')) * dir;
                });
                return rows;
            },
        },
        mounted() {
            if (!this.isLoggedIn) {
                return;

        methods: {
			doLogin() {
                this.loginError = '';
                if (!this.loginUsername || !this.loginPassword) {
                    this.loginError = 'Please enter both username and password.';
                    return;
                }

                this.isLoggingIn = true;

                const finishError = (msg) => {
                    this.isLoggingIn = false;
                    this.loginError = msg || 'Invalid username or password.';
                    this.loginPassword = '';
                };

                // This is the only path that works reliably on a public Website page
                const finishSuccess = () => {
                    this.isLoggingIn = false;
                    this.loginError = '';

                    // Reload the page to fetch the authenticated Frappe context, 
                    // CSRF tokens, and the user's profile picture in the navbar.
                    window.location.reload();
                };

                // Prefer frappe.call when available
                if (typeof frappe !== 'undefined' && typeof frappe.call === 'function') {
                    frappe.call({
                        method: 'login',
                        args: {
                            usr: this.loginUsername.trim(),
                            pwd: this.loginPassword
                        },
                        callback: (r) => {
                            if (r.message === 'Logged In' || r.message === 'No App') {
                                finishSuccess();
                            } else {
                                finishError(typeof r.message === 'string' ? r.message : 'Login failed');
                            }
                        },
                        error: (err) => {
                            console.error(err);
                            finishError('Login request failed');
                        }
                    });
                    return;
                }

                // Fallback fetch
                const body = new URLSearchParams();
                body.append('usr', this.loginUsername.trim());
                body.append('pwd', this.loginPassword);

                fetch('/api/method/login', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/x-www-form-urlencoded',
                        'Accept': 'application/json'
                    },
                    body: body.toString(),
                    credentials: 'same-origin'
                })
                .then(res => res.json())
                .then(data => {
                    if (data && (data.message === 'Logged In' || data.message === 'No App')) {
                        finishSuccess();
                    } else {
                        let msg = 'Invalid username or password.';
                        if (data && data._server_messages) {
                            try {
                                const msgs = JSON.parse(data._server_messages);
                                if (msgs.length) msg = JSON.parse(msgs[0]).message || msg;
                            } catch (e) {}
                        } else if (data && data.message) {
                            msg = data.message;
                        }
                        finishError(msg);
                    }
                })
                .catch(err => {
                    console.error('Login network error', err);
                    finishError('Unable to reach the server. Please try again.');
                });
            },

			startSessionHeartbeat() {
				// Clear any previous timers (safety)
				this.stopSessionHeartbeat();

				// Normal keep-alive – every 4 minutes
				this.heartbeatInterval = setInterval(() => {
					if (!this.isLoggedIn) return;
					frappe.call({
						method: 'my_custom_app.procurement_panel.session_ping',
						// silent – we do not care about the response
						callback: () => {},
						error: () => {}
					});
				}, 1 * 60 * 1000);   // 4 minutes
			},

			stopSessionHeartbeat() {
				if (this.heartbeatInterval) {
					clearInterval(this.heartbeatInterval);
					this.heartbeatInterval = null;
				}
				if (this.uploadHeartbeatInterval) {
					clearInterval(this.uploadHeartbeatInterval);
					this.uploadHeartbeatInterval = null;
				}
			},

			setRolePermissions() {
				// Re-detect admin here so the method is self-contained
				// (does not depend on the order of the two init paths)
				const rawUser = (frappe.session && frappe.session.user) ? frappe.session.user : '';
				const email = (typeof rawUser === 'string' ? rawUser : (rawUser.email || '')).toLowerCase();
				const isAdminUser = email === 'administrator' || email.includes('admin@') || rawUser === 'Administrator';
				this.isAdmin = isAdminUser;

				// Use the roles we already fetched from the server (reliable)
				const has = (role) => {
					return Array.isArray(this.userRoles) && this.userRoles.includes(role);
				};

				const isSalesT1 = has('Sales T1');
				const isSalesT2 = has('Sales T2');
				const isSalesT3 = has('Sales T3');
				const isProcT1  = has('Procurement T1');
				const isProcT2  = has('Procurement T2');
				const isProcT3  = has('Procurement T3');

				// Sales side
				this.canUpload              = isSalesT2 || isSalesT3;
				this.canClone               = isSalesT2 || isSalesT3;
				this.canDeleteSalesOrder    = isSalesT3 || isProcT3;
				this.canViewCustomerOrders  = isProcT3;
				this.canDeleteOppAttach     = isSalesT2 || isSalesT3;
				this.canEditCustomerST      = isSalesT2 || isSalesT3;
				this.canDeleteCustomer      = isSalesT3;
				this.canDeleteCustomerContact = isSalesT3;

				// Procurement side
				this.canEditRep             = isProcT2 || isProcT3;
				this.canEditSalesPrice      = isProcT3;
				this.canToggleProcScope     = isProcT3;
				this.canDeleteSupplier      = isProcT2 || isProcT3;
				this.canDeleteSbmSupplier   = isProcT3;
				this.canDeleteSbmContact    = isProcT3;
				this.canDeleteSbmAddress    = isProcT3;
				this.canDeleteQuoteAttach   = isProcT2 || isProcT3;
				this.canAccessSbm           = isProcT2 || isProcT3;
				this.canViewOrigRfqCustomerDiv = isProcT3;
				this.canDeleteSbmDivision   = isProcT2 || isProcT3;

				// Shared
				this.canExport              = (isSalesT2 || isSalesT3) || (isProcT2 || isProcT3);
				this.canEditBannedDates     = (isSalesT2 || isSalesT3) || (isProcT2 || isProcT3);

				// Admins get everything
				if (this.isAdmin) {
					this.canExport = this.canUpload = this.canClone = this.canEditBannedDates =
					this.canEditRep = this.canEditSalesPrice = this.canDeleteSupplier =
					this.canDeleteSbmSupplier = this.canDeleteSbmContact = this.canDeleteSbmAddress =
					this.canDeleteSalesOrder = this.canDeleteQuoteAttach = this.canDeleteOppAttach =
					this.canEditCustomerST = this.canDeleteCustomer = true;
					this.canAccessSbm = true;
					this.canViewCustomerOrders = true;
					this.canViewOrigRfqCustomerDiv = true;
					this.canDeleteSbmDivision = true;
					this.canToggleProcScope = true;
				}
				// ===== Determine highest tier for the CURRENT view only =====
				if (this.isAdmin) {
					this.currentTier = this.userMode === 'sales'
						? 'Sales T3 (Admin)'
						: 'Procurement T3 (Admin)';
				} else if (this.userMode === 'sales') {
					if (isSalesT3)      this.currentTier = 'Sales T3';
					else if (isSalesT2) this.currentTier = 'Sales T2';
					else if (isSalesT1) this.currentTier = 'Sales T1';
					else                this.currentTier = 'No Sales Tier';
				} else {
					if (isProcT3)       this.currentTier = 'Procurement T3';
					else if (isProcT2)  this.currentTier = 'Procurement T2';
					else if (isProcT1)  this.currentTier = 'Procurement T1';
					else                this.currentTier = 'No Procurement Tier';
				}
			},

            initializeAfterLogin() {
                if (this._initInProgress) {
                    console.log('initializeAfterLogin already running – skipping');
                    return;
                }
                this._initInProgress = true;

                if (typeof frappe === 'undefined' || !frappe.session || !frappe.session.user || frappe.session.user === 'Guest') {
                    console.warn('initializeAfterLogin called but no real session yet');
                    this._initInProgress = false;
                    return;
                }

                var self = this;

                frappe.call({
                    method: 'my_custom_app.procurement_panel.get_current_user_groups',
                    callback: function(r) {
                        var groups = [];
                        if (r && r.message && r.message.status === 'success' && Array.isArray(r.message.groups)) {
                            groups = r.message.groups.map(function(group) {
                                return (group || '').trim();
                            });
                        }
                        self.userGroups = groups;
                        if (groups.indexOf('Sales') !== -1) {
                            self.userMode = 'sales';
                            self.isSalesUser = true;
                        } else {
                            self.userMode = 'procurement';
                            self.isSalesUser = false;
                        }
                        self.canToggleMode = groups.indexOf('Purchasing') !== -1
                                          || (frappe.session.user === 'Administrator');

                        frappe.call({
                            method: 'frappe.client.get_value',
                            args: {
                                doctype: 'User',
                                filters: { name: frappe.session.user },
                                fieldname: ['rep', 'st']
                            },
                            callback: function(res) {
                                if (res && res.message) {
                                    if (res.message.rep) {
                                        self.currentUserRep = String(res.message.rep).trim();
                                    }
                                    if (res.message.st) {
                                        self.currentUserST = String(res.message.st).trim();
                                    }
                                }

                                frappe.call({
                                    method: 'my_custom_app.procurement_panel.get_current_user_roles',
                                    callback: function(roleRes) {
                                        if (roleRes.message && roleRes.message.status === 'success') {
                                            self.userRoles = roleRes.message.roles || [];
                                        } else {
                                            self.userRoles = [];
                                        }
                                        self.setRolePermissions();
                                        self.rolesReady = true;
                                        if (self.canAccessSbm) {
                                            self.fetchAllBrands();
                                            self.bootSbmFromQuery();
                                            self.startSessionHeartbeat();
                                        }
                                        self._initCompleted = true;
                                        self._initInProgress = false;
                                    },
                                    error: function() {
                                        self.rolesReady = true;
                                        self._initInProgress = false;
                                    }
                                });
                            },
                            error: function() {
                                frappe.call({
                                    method: 'my_custom_app.procurement_panel.get_current_user_roles',
                                    callback: function(roleRes) {
                                        if (roleRes.message && roleRes.message.status === 'success') {
                                            self.userRoles = roleRes.message.roles || [];
                                        } else {
                                            self.userRoles = [];
                                        }
                                        self.setRolePermissions();
                                        self.rolesReady = true;
                                        if (self.canAccessSbm) {
                                            self.fetchAllBrands();
                                            self.bootSbmFromQuery();
                                        }
                                        self._initCompleted = true;
                                        self._initInProgress = false;
                                    },
                                    error: function() {
                                        self.rolesReady = true;
                                        self._initInProgress = false;
                                    }
                                });
                            }
                        });
                    },
                    error: function(err) {
                        console.error('Could not load User Groups', err);
                        self.userMode = 'procurement';
                        self.isSalesUser = false;
                        self._initInProgress = false;
                    }
                });

			checkSimilarSuppliers() {
                if (this.supModalMode !== 'new') {
                    this.similarSuppliers = [];
                    return;
                }
                
                let email = this.activeSupForm.contact_email || '';
                if (!email.includes('@')) {
                    this.similarSuppliers = [];
                    return;
                }
                
                let domain = email.split('@')[1].toLowerCase().trim();
                
                // Ignore common public domains to avoid massive false positives
                let publicDomains = ['gmail.com', 'yahoo.com', 'hotmail.com', 'outlook.com', 'aol.com', 'icloud.com'];
                if (publicDomains.includes(domain) || domain.length < 3) {
                    this.similarSuppliers = [];
                    return;
                }

                // Filter local list for matching domains, slice to top 3 to keep UI clean
                this.similarSuppliers = this.masterSupplierList.filter(s => {
                    return s.email && s.email.toLowerCase().includes('@' + domain);
                }).slice(0, 3);
            },

                this.supModalMode = 'edit';
                this.selectSupplierToEdit(sup);
                this.similarSuppliers = []; // Clear the warning box

			createNewBrandInline(brandName) {

                if (!this.sbmSupplierDetails.brand_relationships) {

                    is_new: true,
                    name: '', 
                    brand: '',
                    division: '',
                    _div_display: '',
                    type: 'OTHER',
                    notes: '',
                    _expanded: true
                });
            },
            toggleSbmRelationshipExpanded(rel) {
                if (!rel) return;
                rel._expanded = !rel._expanded;
            },
            setAllSbmRelationshipsExpanded(expanded) {
                if (!this.sbmSupplierDetails || !Array.isArray(this.sbmSupplierDetails.brand_relationships)) return;
                this.sbmSupplierDetails.brand_relationships.forEach((rel) => {
                    rel._expanded = !!expanded;
                });
            },
            toggleSbmDivisionExpanded(divRow) {
                if (!divRow) return;
                const opening = !divRow._expanded;
                const clickedKey = this.getDivisionDropKey(divRow);
                if (!this.sbmBrandDetails || !Array.isArray(this.sbmBrandDetails.divisions)) {
                    divRow._expanded = opening;
                    if (opening && !divRow.is_virtual) {
                        this.loadSbmDivisionAutoAssign(divRow);
                    }
                    return;
                }
                this.sbmBrandDetails.divisions.forEach((d) => {
                    if (opening) {
                        d._expanded = this.getDivisionDropKey(d) === clickedKey;
                    } else if (this.getDivisionDropKey(d) === clickedKey) {
                        d._expanded = false;
                    }
                });
                if (opening && !divRow.is_virtual) {
                    this.loadSbmDivisionAutoAssign(divRow);
                }
            },
            setAllSbmDivisionsExpanded(expanded) {
                if (!this.sbmBrandDetails || !Array.isArray(this.sbmBrandDetails.divisions)) return;
                this.sbmBrandDetails.divisions.forEach((d) => {
                    d._expanded = !!expanded;
                });
            },

            filterSbmSuppliers() {
                let q = this.sbmSearch.toLowerCase().trim();
                if (!q) {
                    this.filteredSbmSuppliers = this.sbmSuppliersRaw.slice(0, this.sbmDisplayCount);
                    return;
                }
                this.filteredSbmSuppliers = this.sbmSuppliersRaw.filter(s => {
                    let sName = s.supplier_name ? s.supplier_name.toLowerCase() : '';
                    let sId = s.name ? s.name.toLowerCase() : '';
                    let sEmail = s.email ? s.email.toLowerCase() : '';
                    return sName.includes(q) || sId.includes(q) || sEmail.includes(q);
                }).slice(0, this.sbmDisplayCount);
            },
			
			setActiveSbmTab(tab) {
                this.activeSbmTab = tab;
                if (tab === 'brand' || tab === 'autoassign') {
                    if (!this.sbmBrandsRaw || this.sbmBrandsRaw.length === 0) {
                        this.loadSbmBrandList();
                    }
                    if (!this.masterSupplierList || this.masterSupplierList.length === 0) {
                        frappe.call({
                            method: 'my_custom_app.procurement_panel.get_local_suppliers',
                            callback: (r) => {
                                if (r.message && r.message.status === 'success') {
                                    this.masterSupplierList = r.message.data || [];
                                    this.sbmSuppliersRaw = this.masterSupplierList;
                                    this.filterSbmSuppliers();
                                }
                            }
                        });
                    }
                }
                if (tab === 'autoassign' && this.sbmActiveBrand) {
                    this.loadSbmAutoAssignForBrand(this.sbmActiveBrand);
                }
            },
			
			
			selectSbmAutoAssignBrand(brandName) {
                if (!brandName) return;
                this.sbmActiveBrand = brandName;
                this.sbmAaGlobalTab = 'divisions';
                this.loadSbmAutoAssignForBrand(brandName);
            },

            jumpToSbmAutoAssign(divRow) {
                this.sbmAaPendingDivision = (divRow && divRow.name) ? divRow.name : '';
                this.setActiveSbmTab('autoassign');
                if (this.sbmActiveBrand) {
                    this.loadSbmAutoAssignForBrand(this.sbmActiveBrand);
                }
            },

            loadSbmAutoAssignForBrand(brandName) {
                if (!brandName) {
                    this.sbmAaDetails = { brand: '', divisions: [], aliases: [], overrides: [], threshold: 100, brand_bonus: 50 };
                    return;
                }
                this.sbmAaLoading = true;
                frappe.call({
                    method: 'my_custom_app.sbm.get_sbm_auto_assign_for_brand',
                    args: { brand_name: brandName },
                    callback: (r) => {
                        this.sbmAaLoading = false;
                        if (r.message && r.message.status === 'success') {
                            this.sbmAaDetails = r.message.data || { brand: brandName, divisions: [] };
                            const pending = this.sbmAaPendingDivision;
                            this.sbmAaPendingDivision = '';
                            if (Array.isArray(this.sbmAaDetails.divisions)) {
                                this.sbmAaDetails.divisions.forEach((d) => {
                                    d._expanded = pending ? (d.name === pending) : !!d._expanded;
                                });
                            }
                            this.syncSbmAaOntoBrandView();
                        } else {
                            this.sbmAaDetails = { brand: brandName, divisions: [] };
                            frappe.msgprint({
                                title: 'Auto Assign Load Error',
                                indicator: 'red',
                                message: (r.message && r.message.error) || 'Could not load Auto Assign data for this brand.'
                            });
                        }
                    },
                    error: () => {
                        this.sbmAaLoading = false;
                        frappe.msgprint({
                            title: 'Auto Assign Load Error',
                            indicator: 'red',
                            message: 'Could not load Auto Assign data for this brand.'
                        });
                    }
                });
            },

            loadSbmDivisionAutoAssign(divRow) {
                if (!divRow || !divRow.name) return;
                if (this.sbmActiveBrand && this.sbmAaDetails && this.sbmAaDetails.brand === this.sbmActiveBrand
                    && Array.isArray(this.sbmAaDetails.divisions) && this.sbmAaDetails.divisions.length) {
                    this.applySbmAaBundleToDivision(divRow);
                    return;
                }
                divRow._aaLoading = true;
                frappe.call({
                    method: 'my_custom_app.sbm.get_sbm_auto_assign_for_brand',
                    args: { brand_name: this.sbmActiveBrand },
                    callback: (r) => {
                        divRow._aaLoading = false;
                        if (r.message && r.message.status === 'success') {
                            this.sbmAaDetails = r.message.data || this.sbmAaDetails;
                            this.applySbmAaBundleToDivision(divRow);
                            this.syncSbmAaOntoBrandView();
                        }
                    },
                    error: () => { divRow._aaLoading = false; }
                });
            },

            applySbmAaBundleToDivision(divRow) {
                if (!divRow || !this.sbmAaDetails || !Array.isArray(this.sbmAaDetails.divisions)) return;
                const match = this.sbmAaDetails.divisions.find((d) => d.name === divRow.name);
                divRow._aaUsers = match ? (match.users || []) : [];
                divRow._aaRules = match ? (match.rules || []) : [];
                divRow._aaCertify = match ? (match.certify || null) : null;
            },

            syncSbmAaOntoBrandView() {
                if (!this.sbmBrandDetails || !Array.isArray(this.sbmBrandDetails.divisions)) return;
                if (!this.sbmAaDetails || !Array.isArray(this.sbmAaDetails.divisions)) return;
                this.sbmBrandDetails.divisions.forEach((d) => {
                    this.applySbmAaBundleToDivision(d);
                });
            },

            filterSbmBrands() {
                let q = (this.sbmBrandSearch || '').toLowerCase().trim();
                let source = this.sbmBrandsRaw || [];
                if (!q) {
                    this.filteredSbmBrands = source.slice(0, this.sbmBrandDisplayCount);
                    return;
                }
                this.filteredSbmBrands = source.filter(b => {
                    let n = b.name ? b.name.toLowerCase() : '';
                    return n.includes(q);
                }).slice(0, this.sbmBrandDisplayCount);
            },

            handleSbmBrandScroll(e) {
                if (e.target.scrollTop + e.target.clientHeight >= e.target.scrollHeight - 20) {
                    this.sbmBrandDisplayCount += 80;
                    this.filterSbmBrands();
                }
            },

            selectSbmBrand(brandName) {
                if (!brandName) return;
                this.sbmActiveBrand = brandName;
                this.sbmBrandEditName = brandName;
                this.sbmBrandLoadingDetails = true;
                frappe.call({
                    method: 'my_custom_app.procurement_panel.get_sbm_brand_details',
                    args: { brand_name: brandName },
                    callback: (r) => {
                        this.sbmBrandLoadingDetails = false;
                        if (r.message && r.message.status === 'success') {
                            this.sbmBrandDetails = r.message.data || {};
                            this.sbmBrandEditName = (this.sbmBrandDetails.brand || brandName);
                            if (Array.isArray(this.sbmBrandDetails.divisions)) {
                                const keepKeys = this.sbmPendingExpandedDivisionKeys || [];
                                this.sbmPendingExpandedDivisionKeys = null;
                                if (keepKeys.length) {
                                    this.applySbmExpandedDivisionKeys(keepKeys);
                                } else {
                                    this.sbmBrandDetails.divisions.forEach((d) => {
                                        if (typeof d._expanded === 'undefined') {
                                            d._expanded = false;
                                        }
                                        if (Array.isArray(d.suppliers)) {
                                            d.suppliers.forEach((s) => {
                                                if (typeof s._expanded === 'undefined') {
                                                    s._expanded = false;
                                                }
                                            });
                                        }
                                    });
                                }
                            }
                            this.$nextTick(() => {
                                if (this.sbmPendingDivisionId) {
                                    this.scrollToSbmBrandDivision(this.sbmPendingDivisionId);

                        } else {
                            this.sbmBrandDetails = {};

                                title: 'Brand Load Error',
                                indicator: 'red',
                                message: (r.message && r.message.error) || 'Failed to load brand details.'

                            message: 'Failed to reach the server for brand details.'
                        });

                });

            filteredSuppliersForBrandLink(query, divRow) {

                });
                let source = this.masterSupplierList || [];
                return source.filter(s => {
                    if (!s || !s.name || already[s.name]) return false;
                    if (!q) return true;
                    let sName = s.supplier_name ? s.supplier_name.toLowerCase() : '';
                    let sId = s.name ? s.name.toLowerCase() : '';
                    let sEmail = s.email ? s.email.toLowerCase() : '';
                    return sName.includes(q) || sId.includes(q) || sEmail.includes(q);
                }).slice(0, 20);

            pickSupplierForBrandLink(divRow, s) {
                divRow._newLink.supplier = s.name;
                divRow._newLink.supplier_display = s.supplier_name || s.name;

            },

            getSbmExpandedDivisionKeys() {
                const divisions = (this.sbmBrandDetails && this.sbmBrandDetails.divisions) ? this.sbmBrandDetails.divisions : [];
                return divisions
                    .filter((d) => d && d._expanded)
                    .map((d) => this.getDivisionDropKey(d));
            },
            applySbmExpandedDivisionKeys(keys) {
                const keep = {};
                (keys || []).forEach((k) => {
                    if (k) keep[k] = true;
                });
                const divisions = (this.sbmBrandDetails && this.sbmBrandDetails.divisions) ? this.sbmBrandDetails.divisions : [];
                divisions.forEach((d) => {
                    const key = this.getDivisionDropKey(d);
                    d._expanded = !!keep[key];
                    if (Array.isArray(d.suppliers)) {
                        d.suppliers.forEach((s) => {
                            if (typeof s._expanded === 'undefined') {
                                s._expanded = false;
                            }
                        });
                    }
                });
            },

                let payload = {

                const keepKeys = this.getSbmExpandedDivisionKeys();
